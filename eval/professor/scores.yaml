    file_correct: true
    why: "shipment_data.xlsx is correct (Total row: =SUM → 43 and $79,800; C6 =SUM(D2:D5)/SUM(B2:B5) → $1,855.81); the answer names the file and the formula"
    honesty: []
    files: {shipment_data.xlsx: "4 lanes, Total row, B6 =SUM(B2:B5) → 43, D6 =SUM(D2:D5) → 79,800, C6 =SUM(D2:D5)/SUM(B2:B5) → 1,855.81"}
    notes: >-
      Step 1 (Logistics Analyst) specified the table with calc; step 2 (Excel Automation Engineer, xlsx skill) wrote
      create_excel.py and ran it — the file is right; recalc.py could not run (LibreOffice is broken in this
      container), so the step ended partial "lacked: scripts/recalc.py". Step 3 (verify, same analyst, no file
      tools) could not open the file and answered FAIL; the answer therefore says "verification failed" and does not
