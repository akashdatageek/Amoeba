# D91 pre-registered check (written before any run on stream m2's gate set; committed before the runs).
# Stage A's helpful hand edit (h2-assumptions-rule, same text) re-tested once under Gate v3 on the 15 gate tasks plus
# the 3 retention tasks, 3 repeats each: decided at alpha = 0.05 (gate.v3.check_alpha), one-sided permutation test on
# per-task means, gain > max(noise, 0.05), rules 1, 4, 5, 5b, 6 as in v3. Rows are marked "check": true; it uses none
# of the loop's quota and never changes the recipe store (M-P2 starts from the seed recipe, no hand edits).
#   python -m scripts.run_experiment --stream m2 --family calc --edit eval/loop/m2/hypotheses/check-assumptions.yaml --check ...
hypothesis_id: check-assumptions
edit:
  op: add_planner_rule
  params:
    text: "The final answer must end with a section headed '## Assumptions' that lists every assumption the result relies on (rounding, rates or prices held fixed, units, anything the task leaves open), even when they seem obvious."
predicted_delta: 0.2
rationale: "Re-test of Stage A's h2 under Gate v3 on a fresh gate set: practice feedback after the shift names 'assumptions section' as missing; the summariser writes one only if the plan's answer step asks for it."
