      6. Multiply the number of boxes by the price per box ($42.50).\n\nProvide your\
      \ work step-by-step. Output format: a memo with clear headings for Floor Area,\
      \ Exact Tile Count, Buffered Tile Count, Total Boxes, and Total Cost."
