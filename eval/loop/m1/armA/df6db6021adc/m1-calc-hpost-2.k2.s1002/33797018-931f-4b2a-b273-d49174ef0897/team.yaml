      \ Width).\n2. Calculate the area of a single tile (Length * Width).\n3. Divide\
      \ the floor area by the tile area to find the exact number of tiles needed.\n\
      4. Add a 10% buffer to the exact tile count (Exact * 1.10).\n5. Divide the buffered\
