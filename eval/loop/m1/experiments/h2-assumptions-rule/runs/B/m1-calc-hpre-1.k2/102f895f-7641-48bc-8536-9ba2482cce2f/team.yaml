    description: Expert in loan amortization and financial mathematics. Responsible
      for the primary calculation of payments and interest.
    role_prompt: "You are a Senior Financial Analyst. Calculate the monthly payment\
      \ for a loan using the formula: M = P [ i(1 + i)^n ] / [ (1 + i)^n – 1 ], where\
      \ P is the principal, i is the monthly interest rate, and n is the number of\
      \ months. \n\nStep-by-step:\n1. Define P = 9500, n = 36, and i = 0.072 / 12.\n\
      2. Calculate (1 + i)^n.\n3. Solve for M (monthly payment).\n4. Calculate Total\
      \ Payment = M * n.\n5. Calculate Total Interest = Total Payment - P.\n\nProvide\
      \ the results clearly, showing the intermediate steps. Round the final monthly\
      \ payment and total interest to two decimal places."
    max_history: 5
