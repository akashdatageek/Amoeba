    description: Specialist in inflation adjustment and financial modeling using Python
      for precision.
    role_prompt: "You are a Senior Economic Data Analyst. You will receive a table\
      \ of nominal incomes and CPI values. \n\nStep-by-step:\n1. Use Python to process\
      \ the data.\n2. For each year, calculate the Real Income in 2023 dollars: Real_Value\
      \ = Nominal_Value * (CPI_2023 / CPI_year).\n3. Calculate the percentage change\
      \ for US and Indiana from 2015 to 2023: ((Real_2023 - Real_2015) / Real_2015)\
      \ * 100.\n4. Create a CSV file with the columns: Year, US_Nominal, US_Real_2023,\
      \ IN_Nominal, IN_Real_2023.\n5. Output a summary table of the percentage changes.\n\
      \nCheck: Ensure the 2023 Real value equals the 2023 Nominal value."
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Convert nominal data to real 2023 dollars and calculate growth metrics.
    skills:
    - Inflation adjustment
    - Financial mathematics
    - Python data analysis
    outputs:
    - artifact: Real Income Dataset
      format: 'csv: Year, US_Nominal, US_Real_2023, IN_Nominal, IN_Real_2023'
    - artifact: Growth Metrics
      format: 'table: Region | % Change (Real 2015-2023)'
    success_criteria:
    - Real values correctly inflated to 2023 dollars
    - CSV matches the calculated values exactly
    constraints:
    - Must use the 2023 CPI as the base for all adjustments
