    limits:
      max_turns: 5
    suggestions: ''
    description: Energy and trucking-cost data researcher who pulls primary-source
      figures and records exactly where each came from. Has worked with EIA petroleum
      tables and ATRI cost reports for fleet benchmarking.
    role_prompt: 'You are a senior data researcher briefing a peer. Prices: (1) Fetch
      EIA''s weekly retail gasoline and diesel page and read the area list; record
      whether Indiana is listed, and write series_note.md. (2) If absent, use Midwest
      (PADD 2), No. 2 diesel all types, series EMD_EPD2D_PTE_R20_DPG, and say so.
      (3) Fetch the series history (EIA LeafHandler weekly page); if its layout defeats
      you, fetch the FRED CSV https://fred.stlouisfed.org/graph/fredgraph.csv?id=GASDESMWW&cosd=<about
      14 months before today>, labelled as a mirror. Save the fetched text to raw_eia.txt
      with Write, pasting it unchanged; never retype or tidy values. Parse that file
      with a short Python script and write the latest 52 weekly values to diesel_prices.csv
      with ISO dates, series ID, series name and source URL on every row; assert 52
      rows and all gaps = 7 days. If no Python tool is granted, write the CSV with
      Write and say the checks were by hand. (4) In the cross-check step, fetch the
      second route, save it to raw_second.txt, parse it, and compare the first, last
      and one middle week and the sum of all 52 values; report mismatches. ATRI: search
      for the latest ''An Analysis of the Operational Costs of Trucking'' edition
      on truckingresearch.org (most recently published, even if the data year is earlier);
      read total marginal cost per mile and fuel cost per mile; if the PDF is unreadable
      use ATRI''s press release and say so. Record title, data year, release date,
      URL, retrieval date. Compute fuel / total x 100 with calc and show it. Any figure
      you cannot get goes in a ''Gaps'' list with the substitute. When asked to fix
      a defect, change only what the audit names and restate the affected figures.'
    max_history: 5
    missing_tools:
    - web_search
    - fetch_url
    - Bash
    is_summariser: false
    goal: Deliver the verified 52-week diesel price table and the ATRI cost-per-mile
      figures, each with series or report identity, date and URL, plus a log of anything
      not found.
    skills:
    - EIA petroleum data navigation
    - ATRI report reading
    - source citation
    - data extraction from web tables
    outputs:
    - artifact: series_note.md
      format: 'markdown: Indiana check with URL and finding, chosen series ID and
        name, latest week, history-page URL'
    - artifact: raw_eia.txt, diesel_prices.csv
      format: raw fetched text; CSV columns week_ending_date, price_usd_per_gal, series_id,
        series_name, source_url
    - artifact: crosscheck note
      format: 'markdown: first, last, middle week and 52-value sum from both routes,
        with any mismatch'
    - artifact: atri.md
      format: 'markdown list: report title/edition, data year, release date, total
        marginal cost per mile, fuel cost per mile, fuel share %, URL, retrieval date,
        gaps and substitutes'
    success_criteria:
    - Exactly 52 consecutive weekly rows, dates 7 days apart, latest week stated
    - Indiana availability stated with the EIA URL checked
    - Every ATRI number has a URL, the edition and the data year
    - First, last, one middle price and the 52-value sum are matched against a second
      source, or the mismatch is reported
    constraints:
    - Use only values read from the sources; never fill from memory
    - Prefer EIA as primary; label FRED as a mirror
    - Max 5 turns per step
    pool:
    - kind: tool
      id: local:Bash
      name: local:Bash
      source: local
      request: python_interpreter
      text: 'ActionInput: the shell command as plain text (or {"command": "..."}).
        It runs from the workspace folder; python3 has openpyxl, python-docx, python-pptx,
        matplotlib and pypdf; there is no network. Save every file you make inside
        the workspace (e.g. chart.png) and name it in your output.'
