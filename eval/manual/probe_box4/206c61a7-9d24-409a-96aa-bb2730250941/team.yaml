requirements:
  R1: Get the weekly retail on-highway diesel price for the most recent 52 weeks from
    EIA, for Indiana if EIA publishes it. Cite the series and the week of each price.
  R2: Compute the fuel surcharge per mile for each of the 52 weeks as (weekly price
    − $1.25) ÷ 6.2, rounded to the cent.
  R3: Compute the fleet's total fuel cost for each of the 52 weeks.
  R4: 'Find the latest ATRI report edition: the most recently published "Operational
    Costs of Trucking" report, even if its data year is earlier. Report its title,
    data year and release date.'
  R5: Find the ATRI total average marginal cost per mile and the fuel cost per mile
    from that report, and compute the fuel share (fuel ÷ total, as a percent).
  R6: Compare the ATRI fuel cost per mile with the carrier's average fuel cost per
    mile over the 52 weeks.
  R7: Deliver an Excel workbook with weekly price, surcharge and fleet fuel cost,
    using live formulas.
  R8: Deliver a PNG line chart of price and surcharge over the 52 weeks.
  R9: Deliver a Word memo of at most 2 pages. It gives the surcharge for each 5-cent
    price from $3.00 to $5.00 (41 rows), the average, highest and lowest week, and
    the ATRI comparison.
  R10: State any figure that could not be obtained and what was used instead.
  R11: The final answer opens with the exact two-sentence interpretation line given
    in the task.
  R12: Run the fleet model on 35 Class 8 tractors at 6.2 mpg and about 2,300 miles
    per week each, with these inputs held in one place.
  R13: Read "weekly retail on-highway diesel price for Indiana" as an EIA Indiana
    state-level weekly series, if one exists. If none exists, say so and use the nearest
    EIA series, labelled as a proxy in every deliverable.
  R14: Read "5-cent price band from $3.00 to $5.00" as bands in 5-cent steps ($3.00,
    $3.05 … $5.00), each giving the surcharge at that price, not at the low end or
    midpoint of a range.
  R15: State every assumption and open question before staffing, including open questions
    for the carrier, and carry them into the final answer.
  R16: Report the source and date of every figure, in the memo and in the workbook
    Notes sheet.
