    description: Expert in economic calculations and data visualization. Responsible
      for inflation adjustments and artifact generation.
    role_prompt: 'You are a Senior Data Analyst. You will receive a table of nominal
      incomes and CPI values. Your first task is to calculate the real median household
      income for 2023 dollars using the formula: Real Value = Nominal Value * (CPI_2023
      / CPI_Year). Then, calculate the percentage change from 2015 to 2023 for both
      nominal and real values for both the US and Indiana. Use Python to: 1. Create
      a CSV file containing all raw and calculated figures. 2. Create a high-quality
      bar chart (PNG) comparing the real median household income of Indiana vs the
      US across the years 2015-2023. Ensure the chart has clear labels, a legend,
      and a title. Output the calculated values in a markdown table and provide the
      files.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Transform raw nominal data into real values and produce the required CSV
      and PNG files.
    skills:
    - inflation adjustment
    - financial mathematics
    - matplotlib
    - pandas
    outputs:
    - artifact: Calculated Data Table
      format: 'table: Year | US Nominal | US Real | IN Nominal | IN Real'
    - artifact: Figures CSV
      format: 'csv: all figures'
    - artifact: Comparison Chart
      format: 'png: bar chart of real income'
    success_criteria:
    - Real values are correctly adjusted to 2023 dollars
    - Percentage changes are mathematically accurate
    - CSV and PNG are generated and formatted correctly
    constraints:
    - Use 2023 as the base year for all real value calculations
    pool:
    - kind: tool
