requirements:
  R1: Gather nominal median household income for Indiana (2015-2023) from official
    U.S. Census Bureau survey estimates.
  R2: Gather nominal median household income for the United States (2015-2023) from
    official U.S. Census Bureau survey estimates.
  R3: Gather official BLS price index values (2015-2023) for inflation adjustment.
  R4: Calculate real median household income expressed in 2023 dollars for both Indiana
    and the US.
  R5: Calculate the percentage change (nominal and real) for both Indiana and the
    US from 2015 to 2023.
  R6: State and justify the specific Census survey and BLS price index used.
  R7: Deliver a CSV file containing all figures (nominal, adjusted, and percentage
    changes).
  R8: Deliver a bar chart (PNG) comparing the real median household income.
  R9: Cite every figure used in the analysis.
  R10: Report the nominal values.
  R11: Report the adjusted values.
max_inner_turns: 3
