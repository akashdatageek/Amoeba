requirements:
  R1: Gather median household income (ACS 1-year, table B19013, B19013_001E and its
    margin of error B19013_001M) for Indiana and the United States for 2015 and 2023
    from official Census Bureau sources.
  R2: Gather the CPI-U (all urban consumers, U.S. city average, all items, not seasonally
    adjusted, annual average, series CUUR0000SA0) for 2015 and 2023 from BLS.
  R3: Report the nominal median household income values (as published in each survey
    year's own dollars) for Indiana and the US, 2015 and 2023.
  R4: Compute the adjusted values for Indiana and the US, expressed in 2023 dollars.
  R5: Report the percentage change from 2015 to 2023 for both geographies, nominal
    and real.
  R6: 'Compare real median household income for Indiana and the United States between
    2015 and 2023 in 2023 dollars: side-by-side levels, the real % change gap in percentage
    points, Indiana as a share of the US, and whether each change exceeds sampling
    error.'
  R7: State which survey and which price index were used and why.
  R8: Deliver a CSV of the figures.
  R9: Deliver a bar chart as a PNG.
  R10: Cite every figure (income values, margins of error, CPI values, the derived
    factor, adjusted values, percentage changes, comparison metrics) with an official
    URL, or with an explicit formula plus cited inputs.
  R11: 'The final answer must open with the mandated line: I read "U.S. Census Bureau
    survey estimates for income" as American Community Survey (ACS) 1-year estimates,
    table B19013 median household income; if you meant Current Population Survey Annual
    Social and Economic Supplement (CPS ASEC), historical table H-8 for states or
    Survey of Income and Program Participation (SIPP), the answer below may not apply.'
  R12: Disclose the method and caveats (2015-to-2023 formula, rounding, ACS sampling
    error, comparability limits), and check the numbers independently before delivery.
    The independent check covers all 10 retrieved source values (4 estimates, 4 MOEs,
    2 CPI values) and every derived figure.
  R13: Document the planning basis in the final answer (objective, assumptions, open
    questions, who produced and verified which figures) so the run can be traced.
