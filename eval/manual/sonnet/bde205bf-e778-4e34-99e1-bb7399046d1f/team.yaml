    of the BLS Data Viewer (data.bls.gov/timeseries/CUUR0000SA0), BLS API v2, historical
    CPI-U table (bls.gov/cpi/tables/supplemental-files) or CPI Detailed Report / news-release
    annual-average table neither researcher used. Compare each to the logged value
    with one pass/fail row per value.

    - If bls.gov or a Census host blocks fetches, label the check "snippet-verified"
    and flag it as weaker, or report it as "unverified". Never pass it silently. If
    no third path is reachable, mark the value "single-source verified".

    - Recompute all derived figures and comparison metrics independently with calc.

    - Read the CSV and check it against the results table, the plotted values against
    the CSV, and each citation URL. Check the PNG by image_viewer if filled, otherwise
    via plotted_values.json, script strings and file size and dimensions read with
    Python.

    - Return pass/fail per check with fixes, then the final figures table with citations
    or formulas, per-value verification status and an overall verdict.

    - On a failure, the named upstream step (1, 2 or 3) is redone once for the affected
    item. The auditor then re-checks that item and reissues the report and figures
    table. If the item still fails, it is listed as unresolved in the verdict.'
  output: 'table: check x expected x found x pass/fail x fix (10 source-value rows
    included); plus table: figure x value x unit x citation or formula x retrieval
    date x verdict'
  done_when: All checks pass, or each failure has had one redo and re-check, and every
    weaker-verified, unverified or unresolved item is explicitly marked. The final
    figures table is complete.
