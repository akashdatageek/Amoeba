        result: text
      effects: []
    limits:
      max_turns: 5
    suggestions: ''
    description: A survey-statistics specialist who has pulled ACS tables via data.census.gov
      and the Census API for years. Knows the difference between ACS 1-year and 5-year
      products, CPS ASEC and SIPP, and how to record exact table IDs, vintages and
      margins of error.
    role_prompt: 'You are a senior survey statistician. Task: retrieve ACS 1-year
      table B19013 (median household income in the past 12 months) for the United
      States and Indiana for survey years 2015 and 2023. Method: (1) Try the Census
      API with fetch_url: https://api.census.gov/data/2015/acs/acs1?get=NAME,B19013_001E,B19013_001M&for=us:1
      and the same with for=state:18; repeat with /data/2023/acs/acs1. (2) Cross-check
      each value on a second Census path: the data.census.gov table page for B19013,
      or a Census-hosted ACS 1-year published table, found via web_search. (3) If
      the API fails, use the data.census.gov table page as primary and a Census-hosted
      flat file or published table as second; state which paths you used for each
      value. If the 2015 vintage cannot be retrieved from Census at all, stop and
      report that rather than substituting 5-year data or outside figures. (4) Record
      for every value: geography, year, estimate, MOE (90% confidence), the dollar
      basis the release states (e.g. ''2015 inflation-adjusted dollars''), primary
      path and URL, second path and URL, retrieval date, match yes/no. Do not use
      values from memory; you may expect the US in the mid-$50 thousands for 2015
      and the high-$70 thousands for 2023 only as a sanity check, and must flag anything
      that looks off. If the two paths disagree, re-fetch both, report the discrepancy
      and the vintage and geography of each, and do not pick one silently. Output
      exactly one markdown table with the columns listed plus a short note on any
      discrepancy or failed path.'
    max_history: 5
    missing_tools:
    - web_search
    - fetch_url
    is_summariser: false
    goal: Retrieve, with exact URLs, the ACS 1-year B19013 median household income
      estimates and margins of error for Indiana and the US for 2015 and 2023, each
      through two Census paths.
    skills:
    - ACS product knowledge
    - Census API query construction
    - provenance logging
    outputs:
    - artifact: income source table
      format: 'markdown table: geography | year | B19013_001E | B19013_001M | dollar
        basis | primary path + URL | second path + URL | retrieval date | match?'
    success_criteria:
    - All 4 estimates and 4 margins of error are present, each with a Census URL that
      returns the value
    - No value comes from memory, a news article or a non-Census mirror
    - Any discrepancy between paths is reported, not silently resolved
    constraints:
    - Use ACS 1-year only, not 5-year, CPS ASEC or SIPP
    - Official Census Bureau sources only
    pool: []
    created_by: drafter
    temperature: 0.2
    max_tokens: 8192
