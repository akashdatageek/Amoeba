  6e3f7bde-0564-4e04-bdfc-04105f54aa4c:
    agent_id: 6e3f7bde-0564-4e04-bdfc-04105f54aa4c
    name: Quantitative Analyst and Chart Builder
    role: worker
    model: gemma-4-31b
    prompt:
      system: 'You are a Group, named Alex, your goal is Effectively delivering information
        according to plan., and the constraint is . '
      user: seed:autoagents_custom_action
      format: sections
    tools:
    - calc
    - local:Write
    - local:Bash
    contract:
      inputs:
        prior: text
      outputs:
        result: text
      effects: []
    limits:
      max_turns: 5
    suggestions: ''
    description: An applied economist-programmer who deflates income series and builds
      clean reproducible outputs. Writes scripts whose numbers can be re-run and traced
      to the cited sources.
    role_prompt: 'You are a senior applied economist. Inputs: the income table (ACS
      B19013 estimates and MOEs) and the CPI table. Method: (1) factor = CPI2023 /
      CPI2015, full precision. (2) For each geography: adj2015 = nominal2015 x factor;
      nominal change = nominal2023/nominal2015 - 1; real change = nominal2023/adj2015
      - 1; adjusted 2015 MOE = MOE2015 x factor; significant if |nominal2023 - adj2015|
      > sqrt(MOE2015adj^2 + MOE2023^2). Compute each number twice (calc tool and Python)
      and confirm agreement. (3) Comparison: real % change gap = Indiana real % minus
      US real %, in percentage points; Indiana share of US = Indiana/US for 2015 (in
      2023 dollars) and 2023, and the change in share in percentage points; Indiana-minus-US
      level difference in each year with its MOE sqrt(MOE_IN^2 + MOE_US^2) as an indicative
      significance check. (4) Write mi_income_indiana_us.csv with columns: geography,
      metric, year, value, unit, dollar_basis, source_url, source_name, retrieval_date,
      formula (blank for retrieved figures; text for derived ones, citing input rows).
      Include rows for CPI values, factor, MOEs, percent changes and comparison metrics.
      (5) Draw real_median_household_income.png with matplotlib: grouped bars per
      geography for 2015 nominal, 2015 in 2023 dollars, 2023; value labels in dollars;
      real % change annotation per geography; title ''Median household income, 2015
      vs 2023, in 2023 dollars''; footnote with source (ACS 1-year B19013; BLS CPI-U
      CUUR0000SA0 annual average). Write plotted_values.json holding what was plotted.
      (6) Save build.py. Return the results table, the comparison table and file names.
      Do not alter inputs; if an input looks wrong, report it instead.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Produce the computed table, the Indiana-versus-US comparison, the CSV with
      source citations, and the PNG bar chart from the sourced inputs.
    skills:
    - deflating time series with CPI
    - csv handling
    - matplotlib charting
    - ACS margin-of-error propagation
    outputs:
    - artifact: results table
      format: 'markdown table: geography | nominal 2015 | 2015 in 2023$ | nominal
        2023 (=2023$) | nominal % change | real % change | MOEs | significant?'
    - artifact: comparison table
      format: 'markdown table: metric | Indiana | US | gap or ratio | formula'
    - artifact: mi_income_indiana_us.csv
      format: CSV with citation columns
    - artifact: real_median_household_income.png
      format: PNG chart
    - artifact: build.py and plotted_values.json
      format: code and JSON in workspace
    success_criteria:
    - Every number in the CSV is traceable to a cited URL or to a stated formula on
      cited inputs
    - Calc and Python agree to the cent
    - Chart title, axis labels, units, legend, value labels and source footnote present
    constraints:
    - Use the inputs exactly as retrieved; no replacement from memory
    - 2023 dollars as the base
    - Round only for display
    pool:
    - kind: tool
      id: local:Write
      name: local:Write
      source: local
      request: file_writing
      text: 'ActionInput: {"file_path": "name.ext", "content": "..."} (a path inside
