plan:
- index: 0
  agent_ids:
  - faf2dd69-37c4-4da3-8a66-61f9459c8619
  text: '[Incentives and Tax Policy Researcher]: Determine 2026 incentive eligibility
    and powertrain-specific taxes/fees'
  kind: work
  covers:
  - R3
  - R8
  - R9
  - R15
  depends_on: []
  do: (a) Pull primary-source text for the 45W termination (vehicles acquired after
    30 Sep 2025; credit was up to $40,000 over 14,000 lb) and the 30C cutoff (placed
    in service after 30 Jun 2026). (b) Search Indiana/IDEM VW trust, EPA CHDV grants
    and the four utilities' make-ready/EV programs for 2026 status. (c) Establish
    federal excise tax and any Indiana fee difference by powertrain (the only step
    that covers these). (d) Decide base-case $ per truck for each item, counting only
    near-certain money. (e) List caveats and upside scenarios.
  output: 'table: item | status in 2026 | applies? | $ per truck used in model | source
    URL | as-of date (plus list: caveats)'
  done_when: every row has a primary-source URL and a date, and the base-case dollar
    amount is stated, even when it is $0
- index: 1
  agent_ids:
  - ecf45a72-0a1c-41f4-94cf-e246015b2ec9
  text: '[Fleet Cost Data Researcher]: Collect dated cost inputs'
  kind: work
  covers:
  - R2
  - R4
  - R5
  - R6
  - R8
  - R9
  - R16
  depends_on: []
  do: (a) EIA diesel (Indiana or Midwest) and EIA Indiana commercial electricity in
    cents/kWh, latest value plus 12-month average. (b) Diesel and BEV tractor prices
    with model, range, battery, warranty and price type. (c) mpg and kWh/mi ranges,
    payload penalty. (d) Maintenance $/mi for both. (e) 150 kW charger hardware, install,
    make-ready/utility upgrade, interconnection lead time and the demand-charge structure
    of an Indiana utility. (f) List gaps and source conflicts. Taxes and fees are
    left to step 1.
  output: 'table: parameter | low | base | high | unit | source + URL | date | notes
    (plus list: gaps and conflicts)'
  done_when: all parameters needed by R2, R4, R5 and R6 have a base value with a URL
    and date, or an explicit labeled gap
- index: 2
  agent_ids:
  - 673b2b59-2b9b-40bd-85a1-ef9f2faab3c1
  text: '[TCO Modeller and Fleet Feasibility Analyst]: Build the TCO model, sensitivities,
    feasibility check and open-items list'
  kind: work
  covers:
  - R1
  - R4
  - R5
  - R6
  - R7
  - R8
  - R10
  - R13
  - R14
  - R17
  - R18
  depends_on:
  - 1
  - 2
  do: '(a) Write and save the model script with sourced inputs (or the calc-only fallback,
    labeled). (b) Compute per-truck 7-yr totals and $/mile for diesel and BEV, 1:1
    and 1:2 charger ratios, including maintenance. (c) Sensitivities and break-evens
    for the top three drivers, incentives on/off, demand charge on/off. (d) Feasibility:
    daily kWh, 1:1 and 1:2 charging windows (about 3.7 h and 7.4 h), fleet peak MW,
    derated range vs 250 mi, interconnection lead time vs the 30C 30 Jun 2026 date,
    weight/payload note. (e) Recheck totals with calc. (f) List assumptions, risks
    and the go/pilot/wait logic. (g) Write the "Open items for the carrier" list (dwell
    window, depot return pattern, utility and tariff, tractor spec, depot power and
    space), each tied to the result it affects.'
  output: 'table: cost component | diesel $/truck 7-yr | BEV $/truck 7-yr | difference
    (plus $/mile row, sensitivity table with break-evens, feasibility list, assumptions
    list, open-items list)'
  done_when: totals reproduce under a calc recheck, the break-even is stated for the
    top three drivers, and every open item names the result it affects
- index: 3
  agent_ids:
  - b4dfccb6-7b80-4d0e-9a87-a981057a024f
  text: '[Cost Model Verifier]: Independently verify sources, dates and arithmetic'
  kind: verify
  covers:
  - R1
  - R3
  - R8
  - R9
  - R14
  depends_on:
  - 1
  - 2
  - 3
  do: (a) Re-open sources for the 8 most influential inputs and confirm value and
    date. (b) Recompute totals independently. (c) Confirm the 45W/30C determination
    against primary text and that no uncertain incentive is in the base case. (d)
    Check units, the 420,000 mi basis and charger-ratio math. (e) Produce a PASS/FAIL
    list, label each FAIL material or minor, and give corrected downstream numbers.
    State "RERUN REQUIRED" if any material FAIL exists, otherwise "CLEARED".
  output: 'list: PASS/FAIL checks with evidence, then table: item | found | should
    be | source | material?'
  done_when: every check is marked PASS or has a specific correction, the recomputed
    totals match or the gap is explained, and the status is RERUN REQUIRED or CLEARED
- index: 4
  agent_ids:
  - 673b2b59-2b9b-40bd-85a1-ef9f2faab3c1
  text: '[TCO Modeller and Fleet Feasibility Analyst]: Correction loop: apply verifier
    corrections and rerun (conditional; at most twice)'
  kind: work
  covers:
  - R1
  - R5
  - R7
  - R10
  - R18
  depends_on:
  - 4
  do: (a) If step 4 says CLEARED with only minor fixes, apply the minor fixes to the
    table text and pass the step 3 artifacts through unchanged, re-emitting the full
    set. (b) If RERUN REQUIRED, update the inputs (incentive status, price, rate,
    arithmetic), rerun the script, recompute the table, $/mile, sensitivities, break-evens,
    feasibility, assumptions, open items and the go/pilot/wait verdict, and list what
    changed. (c) Save the new script. (d) If step 6 returns RERUN REQUIRED once, repeat
    this step a second and final time.
  output: 'table: cost component | diesel $/truck 7-yr | BEV $/truck 7-yr | difference
    (plus $/mile row, updated sensitivity table with break-evens, feasibility list,
    assumptions list, open-items list, changed-numbers list)'
  done_when: all verifier corrections are applied or explicitly rejected with a reason,
    the full artifact set is present, and totals reproduce under a calc recheck
- index: 5
  agent_ids:
  - b4dfccb6-7b80-4d0e-9a87-a981057a024f
  text: '[Cost Model Verifier]: Re-check the corrected model (runs only if step 5
    changed any number)'
  kind: verify
  covers:
  - R1
  - R3
  - R9
  depends_on:
  - 1
  - 2
  - 4
  - 5
  do: '(a) Recompute the changed totals and every figure derived from a corrected
    input. (b) Confirm corrected sources and dates against steps 1 and 2. (c) Confirm
    the recommendation still follows from the numbers. (d) If step 5 changed nothing,
    record "no re-check needed" and CLEARED. (e) Bounded exit: if a material FAIL
    remains after the second pass through steps 5 and 6, state UNRESOLVED and list
    each open item with its best available value, so step 7 proceeds with those items
    labelled.'
  output: 'list: PASS/FAIL checks with evidence and a final status CLEARED, RERUN
    REQUIRED (first round only) or UNRESOLVED with the listed items'
  done_when: status is CLEARED or, after the second round only, UNRESOLVED with items
    listed; a first RERUN REQUIRED sends the work back to step 5 once more before
    step 7 starts
- index: 6
  agent_ids:
  - 0c3a6b90-e1af-416e-8b07-34b2d30701f4
  text: '[Memo Editor and Document Assembler]: Assemble the 2-page Word memo'
  kind: work
  covers:
  - R7
  - R8
  - R9
  - R10
  - R11
  - R12
  - R15
  - R16
  - R17
  - R18
  depends_on:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  do: (a) Use the final cleared numbers (step 5 output, or step 3 where step 5 passed
    it through unchanged) and apply the verifier's corrections from steps 4 and 6;
    label any UNRESOLVED items. (b) Write the mandated line to mandated_line.txt and
    put it first, then compare it character by character with the document's first
    paragraph. (c) Write the recommendation, TCO table, feasibility note, assumptions
    with a one- or two-line "Open items for the carrier", sensitivity lines, one line
    stating that residual value and discounting could shift the result and that the
    undiscounted, no-residual definition may favour BEV, and the dated numbered source
    list. (d) Build the .docx with the docx skill and its local tools, or with python-docx
    if the skill is unfilled. (e) Verify the page count with a PDF conversion through
    the skill's tools; if no converter exists, state "page count unverified" with
    a word/line estimate and a table of 8 rows or fewer. (f) Open the chat reply with
    the same mandated line. Markdown only if no document tool exists at all, with
    R11 flagged as unmet.
  output: 'memo: Word .docx, at most 2 pages (Recommendation, TCO table, Feasibility,
    Assumptions incl. open items, Sensitivity, Sources with dates)'
  done_when: the first paragraph matches the mandated string exactly (programmatic
    comparison passes), the table numbers equal the cleared model, every figure has
    an in-line citation with a dated source entry, the residual-value/discounting
    caveat and open items are present, and the page count is 2 or fewer (or flagged
    unverified)
requirements:
  R1: Compute a 7-year total cost of ownership per truck for diesel vs battery-electric
    (undiscounted sum of purchase, energy, maintenance and infrastructure, net of
    incentives).
  R2: Establish the purchase price of a new diesel Class 8 tractor and of a battery-electric
    Class 8 tractor (dated, sourced, with the price type labeled).
  R3: Determine which federal and Indiana incentives actually apply to a purchase
    in 2026 (45W, 30C, Indiana state, IDEM/VW, EPA grants, utility make-ready). State
    eligibility and the amount used in the model.
  R4: 'Compute fuel/energy cost per mile: Indiana (or Midwest) on-highway diesel price
    vs the EIA Indiana commercial electricity rate, with stated mpg and kWh/mile.'
  R5: Estimate charging infrastructure cost per truck (about 150 kW DC depot chargers,
    installation, utility upgrade, 1:1 and shared 1:2), net of any applicable incentive.
  R6: Estimate maintenance cost per mile and over 7 years for both powertrains (dated
    sources) and carry it in the model.
  R7: Show the TCO table (diesel vs BEV by component, per truck over 7 years, plus
    $/mile).
  R8: State every assumption.
  R9: Cite every figure with its source and date.
  R10: Give a recommendation, including feasibility of 250 mi/day, a short sensitivity
    or break-even on the drivers that could flip it, and a one-line note that residual
    value and discounting could shift the result (the undiscounted, no-residual definition
    may favour BEV).
  R11: Deliver a Word (.docx) memo of at most 2 pages.
  R12: Open the final answer (the memo and the chat reply carrying it) with the mandated
    interpretation line, verbatim.
  R13: 'Model the carrier''s operation as stated: a fleet that runs 20 Class 8 tractors
    on regional routes under 250 miles a day, about 60,000 miles per truck per year,
    in Indiana.'
  R14: 'Plan the work as a lead would before staffing it: pin down the objective and
    deliverables, work out the numbers, surface assumptions and risks, and build in
    checks (shown by the assumptions list, the risk decisions and the verification
    report).'
  R15: Read "federal and Indiana incentives that actually apply to a purchase in 2026"
    as Federal 45W (up to $40,000 for over 14,000 lb, possibly expired for vehicles
    acquired after Sept 30, 2025) plus any Indiana state or utility programs.
  R16: Read "Indiana commercial electricity rate" as the EIA average commercial retail
    price for Indiana in cents/kWh.
  R17: Read "7-year total cost of ownership per truck" as the undiscounted sum of
    purchase, energy, maintenance and infrastructure over 7 years, net of incentives.
  R18: Provide an "Open items for the carrier" list (dwell window, depot return pattern,
    utility and tariff, tractor spec, depot power and space), each tied to the result
    it affects, and carry it into the memo's Assumptions section in one or two lines.
