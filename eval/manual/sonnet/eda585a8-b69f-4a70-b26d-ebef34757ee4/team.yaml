        - **Prefer Excel-2007-era functions** — `SUMIFS`, `INDEX`, `MATCH`, `IFERROR`,
        `SUMPRODUCT` — which need no prefix.

        - **Six post-2007 functions work, but only with an `_xlfn.` prefix**, because
        openpyxl writes your formula into the XML verbatim and Excel stores post-2007
        names prefixed (its UI hides the prefix): `_xlfn.TEXTJOIN`, `_xlfn.CONCAT`,
        `_xlfn.IFS`, `_xlfn.SWITCH`, `_xlfn.MAXIFS`, `_xlfn.MINIFS`. Written bare,
        each yields `#NAME?`.

        - **Never use `XLOOKUP`, `XMATCH`, `SORT`, `FILTER`, `UNIQUE`, or `SEQUENCE`.**
        The runtime''s LibreOffice cannot evaluate them under *any* prefix. Newer
        builds do evaluate them, but they are spilling array functions and an o

