      recency vs the snapshot, licenses), 5 Limitations (snapshot drift, pool-based
      ranking, exclusions), References at 9pt. Cite with numbered brackets: [1]-[5]
      repo URLs, [6]-[10] one endpoint reference per repo (stars and latest-release
      URLs together), [11] https://docs.github.com/en/rest. Letter or A4, 1 inch margins,
      body 11pt. Check the page count by PDF conversion (docx_to_pdf_page_count);
      if unavailable, estimate from words and image height and say it is an estimate.
      If not 2 pages, adjust prose within range or chart height and recheck. Step
