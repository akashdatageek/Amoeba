    - Do not change numbers or add analysis.'
  output: 'memo: Result, Files, Verification, Email status, Caveats and planning notes'
  done_when: numbers match the verified table and the email status matches the delivery
    record exactly.
requirements:
  R1: Find the 5 most-starred open-source multi-agent frameworks (LLM/AI-agent orchestration
    frameworks) on GitHub, using a documented candidate pool and inclusion rule.
  R2: Get each framework's star count (`stargazers_count`) from the GitHub API.
  R3: Get each framework's latest release date (`published_at` of `releases/latest`)
    from the GitHub API.
  R4: Put the data in a spreadsheet (Excel .xlsx file).
  R5: Make a chart of the data (stars per framework, latest release date shown).
  R6: Write a 2-page Word (.docx) report that includes the chart and the data.
  R7: 'Include citations in the report: numbered in-text references and a reference
    list linking to the GitHub repos and the GitHub API endpoints used.'
  R8: Email the report to test@example.com.
  R9: '(implied) Make the data trustworthy: record the retrieval timestamp, confirm
    the open-source license, and have a role that did not produce the artifacts verify
    numbers, rank, files, page count and citations before sending.'
  R10: 'Planning (implied): carry out the delivery planning before staffing and sending.
    That means a stated API call budget, the inclusion rule, the fix loop and the
    send gate, and a risk list that is reported in the final memo.'
max_inner_turns: 3
