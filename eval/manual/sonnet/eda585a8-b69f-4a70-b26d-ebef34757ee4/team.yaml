    - citation formatting
    - python-docx
    - business email
    outputs:
    - artifact: github_agent_frameworks_report.docx
      format: 'docx: title, snapshot date, 5 sections, table, chart with caption,
        numbered references, 2 pages'
    - artifact: Delivery record
      format: 'memo: To, Subject, body, attachments, QA verdict seen, and the tool''s
        send result (message id or error) or the .eml path with ''NOT SENT'''
    success_criteria:
    - Exactly 2 pages with chart, table and references included
    - Every number in text and table matches the step 1 table
    - Every factual statement about a repo or the API has a citation, and every reference
