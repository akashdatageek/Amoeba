    flag and description.

    - Apply the inclusion rule, rank by stars, and document each exclusion.

    - Fetch `/repos/{owner}/{repo}/releases/latest` for the top 7. Skip any 404 or
    archived repo and take the next candidate. If more than 2 are skipped, widen the
    pool.

    - Record the UTC retrieval time and the API URLs.'
  output: 'table: rank | repo | stars | latest tag | published_at | license | repo
    URL | API URLs | retrieved_at, plus the candidate log table and a code block with
    the call budget and raw evidence'
  done_when: 5 repos each have API-sourced stars and published_at, at least 5 other
    candidates are logged, fallbacks are labelled, and actual calls are within budget.
