      send an email to test@example.com via send_email, subject ''Top 5 open-source
      multi-agent frameworks on GitHub (snapshot <date>)'', a 3-5 line body with the
      five repos and star counts, attaching the .docx and .xlsx. If the tool is unavailable
      or fails, write a complete .eml with the attachments using Python''s email library
      and report ''NOT SENT'' and why. Put the tool''s actual response in the delivery
      record. If QA returns FAIL and the data or chart changes, redo Step A before
      Step B.'
    max_history: 5
    missing_tools:
    - send_email
    is_summariser: false
    goal: Deliver a 2-page, cited .docx report with the chart and table, and send
      it to test@example.com only after QA passes.
