    role_prompt: 'You are a senior technical writer. Step A (before QA): draft 500-600
      words of prose, then build github_agent_frameworks_report.docx with python-docx:
      title, snapshot date line (UTC), 1 Purpose and method (candidate pool, inclusion
      rule, endpoints /repos/{o}/{r} and /releases/latest, and the caveat that releases/latest
      excludes drafts and pre-releases), 2 Results (5-row table: rank, repo, stars,
