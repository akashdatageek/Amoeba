requirements:
  R1: Get the weekly retail on-highway diesel price (all types) for the most recent
    52 weeks from EIA (Midwest PADD 2 as proxy for Indiana), and cite the series and
    the week date of each price.
  R2: For each of the 52 weeks, compute the fuel surcharge per mile = ROUND((price
    - 1.25)/6.2, 2) and the fleet's total weekly fuel cost = 35 x 2,300 / 6.2 x price.
  R3: Find the latest ATRI Operational Costs of Trucking average marginal cost per
    mile (total, fuel component, fuel share) and compare it with the carrier's average
    fuel cost per mile over the 52 weeks.
  R4: Deliver an Excel workbook with weekly price, surcharge and fleet fuel cost,
    using live formulas.
  R5: Deliver a PNG line chart of price and surcharge over the 52 weeks.
  R6: Deliver a Word memo of at most 2 pages containing the surcharge for each 5-cent
    price band from $3.00 to $5.00, the average, highest and lowest week, and the
    ATRI comparison.
  R7: The memo states the source and date of every figure.
  R8: State any figure that could not be obtained and what was used instead (including
    the Midwest-for-Indiana proxy).
  R9: The final answer opens with the required line stating the two interpretations
    (Midwest PADD 2 proxy; 5-cent bands).
