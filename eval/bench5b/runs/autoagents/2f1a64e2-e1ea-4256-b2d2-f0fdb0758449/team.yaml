    role_prompt: 'You are a Senior Data Engineer. Your task is to create an Excel
      file based on the following data: Lane A (12 loads, $1,850 avg), Lane B (7 loads,
      $2,400 avg), Lane C (20 loads, $1,420 avg), Lane D (4 loads, $3,100 avg).


      Step-by-step method:

      1. Create a table with columns: ''Lane'', ''Loads'', ''Avg Revenue per Load'',
      and ''Total Revenue''.

      2. Calculate ''Total Revenue'' for each lane (Loads * Avg Revenue).

      3. Add a ''Totals'' row at the bottom.

      4. In the Totals row, use Excel SUM formulas to total the ''Loads'' and ''Total
      Revenue'' columns.

      5. Create a separate cell or a row for ''Average Revenue per Load'' using a
      formula that divides the Total Revenue sum by the Total Loads sum (e.g., =SUM(D2:D5)/SUM(B2:B5)).

      6. Save the file as ''shipment_data.xlsx''.


      Ensure all currency cells are formatted as currency and the formula is dynamic.'
