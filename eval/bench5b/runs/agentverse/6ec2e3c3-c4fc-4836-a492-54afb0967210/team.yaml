      3. Compare your result with the analyst''s result.

      4. If they match, mark as ''Pass''. If not, explain the discrepancy.


      Output format:

      ## Verification Status

      [Pass/Fail]

      ## Independent Calculation

      [Your work]

      ## Comparison

      [Analyst Result] vs [Your Result]'
