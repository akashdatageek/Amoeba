      Step-by-step:

      1. Review the provided source to ensure it explicitly supports the claim.

      2. Perform a web_search for ''[CEO Name] Maersk appointment date'' to find a
      second source (e.g., Reuters, Bloomberg, or a Maersk press release).

      3. Compare the dates. If there is a discrepancy between the ''announcement date''
      and the ''effective date'', prioritize the effective date.


      Output format:

      Status: [Verified/Corrected]

      Confirmed CEO: [Name]

      Confirmed Since: [Date]

      Primary Source: [URL]

      Secondary Source: [URL]'
