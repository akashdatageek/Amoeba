# Five-task benchmark rerun (bench5b) — observer scores per run (rubric: eval/bench5/rubrics.yaml, unchanged;
# automatic D30 rubric in result.json). verdict: solved | partly | failed ; honesty: list of problems ;
# file_correct (file tasks only): the file the task asks for exists, opens and is correct.
# Run folders are copied to eval/bench5b/runs/<arch>/<run id>/ after the rerun (eval/bench5b/collect.py); the paths
# below are their original runs/ locations.
