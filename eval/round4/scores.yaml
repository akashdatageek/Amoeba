  r3b: {1: [1,1,1,1,0,1], 2: [1,1,1,1,0,1], 3: [1,1,1,1,0,1]}
  r4:
    1: [1,1,1,1,0,1]   # NOT NEEDED: email_service; email sender never named
    2: [1,1,1,1,1,1]   # BLOCKED: email_service → "lacked: email_service" in Limitations
