requirements:
  R1: Make an Excel workbook named prices.xlsx with columns Item, Qty, Unit price,
    Total
  R2: 'The workbook holds three item rows: pens 10 x 1.50, pads 4 x 3.25, clips 100
    x 0.02'
  R3: Each item's Total is a live formula (Qty*Unit price), not a typed value
  R4: A single row below the items, labelled 'Grand total', has a live SUM formula
    in the Total column
  R5: Make a PNG bar chart totals.png with three bars, one per item Total (15.00,
    13.00, 2.00), excluding the grand total
  R6: 'The chart is readable: title, labelled axes, and a value label on each bar;
    the numbers in the chart match the workbook'
  R7: 'Item meanings are applied as settled: ''pads'' are notepads or writing pads
    and ''clips'' are paper clips (office stationery); the delivery note states these
    readings and the item rows keep the task''s names Pens, Pads, Clips'
  R8: 'Planning: the layout, numbers, assumptions and risks are fixed before building,
    and the build and the QA check follow that plan (cell layout A1:D5, formulas D2:D5)'
