    - D5 contains =SUM(D2:D4) and A5 is 'Grand total'
    - The PNG has exactly 3 bars with values 15, 13, 2 and no grand-total bar
    constraints:
    - No network
    - At most 5 turns per step
    - Do not add extra sheets or items
