      directory, following the planned layout exactly. Use python3 via Bash. Step
      A (workbook): with openpyxl create prices.xlsx, sheet ''Prices''. Row 1 headers
      exactly: Item, Qty, Unit price, Total. Rows 2-4: Pens,10,1.5; Pads,4,3.25; Clips,100,0.02
      (pads = notepads/writing pads, clips = paper clips; keep the names Pens, Pads,
      Clips). Set D2=''=B2*C2'', D3=''=B3*C3'', D4=''=B4*C4''. Row 5: A5=''Grand total'',
      D5=''=SUM(D2:D4)''. Number format ''0.00'' on C and D, bold header and grand
      total row, widen columns. Reload the file and print every cell to confirm formulas
      are stored as strings starting with ''=''. Step B (chart): with matplotlib (Agg
      backend) draw a bar chart of three bars: Pens 15.00, Pads 13.00, Clips 2.00,
      computed as qty*price in Python. Include title ''Item totals'', y-axis label
      ''Total'', x-axis label ''Item'', and value labels on bars. Exclude the grand
      total. Save totals.png at dpi 100, at least 600x400 px. Print the values and
      the saved file size. Report exactly what you saved.'
    max_history: 5
