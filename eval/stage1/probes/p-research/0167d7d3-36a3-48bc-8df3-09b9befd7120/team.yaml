    name: Census Data Researcher
    role: worker
    model: claude-sonnet-5-5, gemma-4-31b
    prompt:
      system: 'You are a Group, named Alex, your goal is Effectively delivering information
        according to plan., and the constraint is . '
      user: seed:autoagents_custom_action
      format: sections
    tools:
    - web_search
    - fetch_url
    - calc
    - local:Bash
    - local:Write
    - local:Read
    - find_tool
    contract:
      inputs:
        prior: text
      outputs:
        result: text
      effects: []
    limits:
      max_turns: 6
    suggestions: ''
    description: A demographic data specialist who knows Census Bureau products and
      the difference between resident population and apportionment population. Retrieves
      the Indiana figure straight from Census.gov pages.
    role_prompt: 'You are a senior Census data researcher. Task: find Indiana''s 2020
      Census resident population (April 1, 2020; excludes overseas federal personnel)
      from an official census.gov source. Method: 0) First write one ''Lookup plan''
      bullet: which release you will cite (2020 Census Apportionment Results or P.L.
      94-171 Redistricting Data), that you want the resident population concept (not
      the apportionment count that includes overseas personnel), and that ''date''
      means the release/publication date. 1) web_search for ''Indiana 2020 Census
      resident population census.gov apportionment'' and the P.L. 94-171 redistricting
      release. 2) fetch_url the best census.gov page (for example the 2020 Census
      Apportionment Results tables, the redistricting data release, or a state profile).
      3) Quote the Indiana figure exactly as shown and say whether it is resident
      population or apportionment population. 4) Record the page title, full URL,
      and the release or publication date shown on the page, and say where on the
      page the date appears. 5) If a second census.gov source gives the figure, record
      it too. Output a bulleted list: lookup plan; figure; concept; source title;
      URL; date; date type (release/publication/last revised); quoted passage; corroborating
      source if any. If the page shows no date, say so and use the release date from
      a census.gov press release, naming it. Do not use non-census sites as the cited
      source.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Set out a short lookup plan, then find Indiana's 2020 Census resident population
      and the exact title, URL and release date of an official Census.gov source.
    skills:
    - Census product knowledge
    - source evaluation
    - web research
    outputs:
    - artifact: Evidence note
      format: 'list: lookup plan, figure, source title, URL, release date, quoted
        passage, which population concept it is'
    success_criteria:
    - A lookup plan line comes first
    - The figure comes from a census.gov page and is quoted from the page
    - The release date is stated on or alongside the page
    - The population concept is labelled
    constraints:
    - Use only census.gov (or its subdomains) as the cited source
    - Do not infer the figure from memory; quote it from the page
    - At most 5 turns
    pool:
    - kind: tool
      id: local:Bash
      name: local:Bash
      source: local
      request: core
      text: 'ActionInput: the shell command as plain text (or {"command": "..."}).
        It runs from the workspace folder; python3 has openpyxl, python-docx, python-pptx,
        matplotlib and pypdf; there is no network. Save every file you make inside
        the workspace (e.g. chart.png) and name it in your output.'
    - kind: tool
      id: local:Write
      name: local:Write
      source: local
      request: core
      text: 'ActionInput: {"file_path": "name.ext", "content": "..."} (a path inside
        the workspace).'
    - kind: tool
      id: local:Read
      name: local:Read
      source: local
      request: core
      text: 'ActionInput: a file path inside the workspace (relative paths start there),
        or {"file_path": "...", "offset": N, "limit": N}.'
    created_by: drafter
    temperature: 0.2
    max_tokens: 8192
