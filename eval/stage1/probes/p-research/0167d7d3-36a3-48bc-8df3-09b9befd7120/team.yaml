    concept, release date as the date. 2) Search for the Indiana 2020 Census resident
    population on census.gov. 3) Fetch the best page (apportionment results or P.L.
    94-171 release). 4) Record the figure, concept, title, URL, release date, and
    a quoted passage. 5) If a second census.gov source exists, record it.'
  output: 'list: lookup plan, figure, concept, source title, URL, release date, quoted
