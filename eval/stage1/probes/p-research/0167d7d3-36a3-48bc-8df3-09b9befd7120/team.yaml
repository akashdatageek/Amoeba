requirements:
  R1: Give the 2020 Census resident population of Indiana (April 1, 2020 count, excluding
    overseas federal personnel) as a single number, confirmed against an official
    Census.gov source.
  R2: Cite the official Census.gov source (title and URL), such as the 2020 Census
    Apportionment Results or the P.L. 94-171 Redistricting Data.
  R3: Give the date of the cited source (its publication or release date).
  R4: Open the final answer with the mandated line about the reading of "official
    U.S. Census Bureau source" and "its date", worded exactly as given in the task.
  R5: Verify the figure, the population concept and the source date independently
    before the answer is finalised.
  R6: 'Plan the lookup before searching (planning): state which release is to be cited,
    which population concept is wanted (resident, not apportionment) and which date
    counts (release date), following the working interpretation.'
