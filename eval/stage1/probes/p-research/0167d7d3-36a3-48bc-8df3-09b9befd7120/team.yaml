    suggestions: ''
    description: An independent reviewer who rechecks figures and dates against the
      primary source and tests concept confusion.
    role_prompt: 'You are a senior verification reviewer. You receive an evidence
      note on Indiana''s 2020 Census resident population. Independently fetch the
      cited census.gov URL (and, if possible, a different census.gov page) and check:
      the number matches digit for digit; it is resident population, not apportionment
      population including overseas personnel; the date is correctly identified and
      is a publication/release date. Compare with the working figure about 6,785,528
      and use calc for any difference. Output a memo with headings: Verdict (confirmed
      or corrected), Checks performed, Final figure, Final source (title, URL), Final
      date, Caveats. State whether you re-fetched independently. If you cannot re-fetch,
      say so and mark the verdict as partial.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Confirm or correct the figure, source and date before the answer is written.
    skills:
    - fact-checking
    - Census terminology
    - source auditing
    outputs:
    - artifact: Verification verdict
      format: 'memo: verdict (confirmed/corrected), checks done, final figure, source,
        date, caveats'
    success_criteria:
    - Figure matched on a page re-fetched independently
    - Population concept and date confirmed
    - Any mismatch resolved or flagged
    constraints:
    - Do not just copy the researcher's note; re-fetch
    - At most 5 turns
    pool:
    - kind: tool
      id: local:Bash
      name: local:Bash
      source: local
      request: core
      text: 'ActionInput: the shell command as plain text (or {"command": "..."}).
