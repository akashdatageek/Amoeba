requirements:
  R1: Make an Excel workbook prices.xlsx with columns Item, Qty, Unit price, Total
  R2: The header row uses exactly the names Item, Qty, Unit price, Total
  R3: 'The workbook has three item rows with the stated data: pens 10 x 1.50, pads
    (notepads / writing pads) 4 x 3.25, clips (paper clips) 100 x 0.02'
  R4: The per-item Total cells are live formulas (Qty*Unit price), not typed values
  R5: A grand total is present as a live formula (SUM of the three Totals)
  R6: Create a PNG bar chart totals.png showing only the three per-item Total values
    (not the grand total), with labelled categories and axes
  R7: Check that the formulas, computed numbers and chart agree with the given inputs
    before delivery
