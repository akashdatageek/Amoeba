    description: Hands-on engineer who builds small Excel deliverables with openpyxl
      and static charts with matplotlib. Writes formulas rather than pasted values
      and keeps files clean and reproducible.
    role_prompt: 'You are a senior engineer building two small files in the workspace.
      Step A (prices.xlsx): first, in your first turn, write a short build plan as
      a bulleted list of 5 items: objective, numbers (15, 13, 2, grand total 30),
      assumptions (no currency symbol, sheet ''Prices''), risks (openpyxl caches no
      formula values), checks (reload and print cells). Then with Bash and python3
      openpyxl, make a workbook with one sheet ''Prices''. Row 1 headers exactly:
      Item, Qty, Unit price, Total. Rows 2-4: pens 10 1.50; pads 4 3.25; clips 100
      0.02 (Qty and Unit price are numeric). In D2:D4 write formulas like =B2*C2.
      Row 5: A5 ''Grand total'', D5 =SUM(D2:D4). Set number format 0.00 on C and D,
      bold the header and the grand-total row, and widen the columns. Save as prices.xlsx,
      then reload it with openpyxl and print the cell values to confirm that the formulas
      are strings starting with ''=''. Step B (totals.png): compute the totals with
      Python (Qty*Unit price, so 15.00, 13.00 and 2.00; you may check with calc).
      Draw a matplotlib bar chart of only these three totals with the labels pens,
      pads, clips. Add the title ''Total by item'', y-label ''Total'', value labels
      on the bars and figsize (7,4.5), and save at dpi 120 to totals.png. Do not include
      the grand total. Confirm the file exists and its size. Report briefly what you
      created, including the list of bar labels and values plotted.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Produce prices.xlsx with live formulas and totals.png as a correct bar chart
      of the three item totals, after a short build plan.
    skills:
    - openpyxl
    - Excel formulas
    - matplotlib
    - xlsx skill
    outputs:
    - artifact: build plan
      format: 'bulleted list: objective, numbers, assumptions, risks, checks'
    - artifact: prices.xlsx
      format: 'xlsx: sheet Prices, columns Item, Qty, Unit price, Total, 3 item rows,
        grand total row with formulas'
    - artifact: totals.png
      format: PNG bar chart, 3 bars
    success_criteria:
    - D2:D4 contain =B*C formulas and D5 contains =SUM(D2:D4)
    - Header names are exactly Item, Qty, Unit price, Total
    - totals.png has exactly 3 bars with values 15, 13 and 2, and is at least 600
      px wide
    constraints:
    - Totals and grand total must be formulas, not constants
    - Chart excludes the grand total
    - Work offline in the workspace; each step must finish in 5 turns
    - After saving totals.png, reopen it (PIL or matplotlib.image) and print its width
      x height. If either side is under 600 px, re-save with a higher dpi (e.g. 150,
      giving 1050x675) and re-check before finishing. Do not stop at dpi 120.
