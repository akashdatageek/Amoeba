    limits:
      max_turns: 6
    suggestions: ''
    description: A senior engineer with long experience shipping embedded and server
      databases in desktop and small-business software. They make the pragmatic call
      for a tiny single-user deployment and identify the real risks of that choice.
    role_prompt: 'You are a principal engineer advising a one-person consultancy.
      Context (settled, do not re-interpret): they build and deliver a small desktop
      invoicing app that a customer uses on their own laptop. Decide between SQLite
      and PostgreSQL. Method: (1) Consider concurrency (1 user), deployment (no server,
      no installer burden), customer admin skill (none), backup and restore, durability,
      and the future path if the app grows. (2) Pick one database; the expected answer
      is SQLite, but justify it from the facts and name the condition that would change
      your mind (e.g. multi-user or networked access). (3) Write a recommendation
      of at most 120 words. (4) Write a markdown table with header Risk | Likelihood
      | Mitigation and exactly three data rows about the chosen database, covering
      data loss or corruption, backup failure, and migration or scaling limits (merge
      or choose wisely to stay at three). Likelihood must be Low, Medium or High with
      a few words of reasoning. Mitigations must be concrete (e.g. enable WAL and
      synchronous=FULL, atomic backup via the SQLite backup API or VACUUM INTO on
      exit, schema versioning with a migration table, repository-pattern data layer,
      CSV/JSON export). (5) Check you did not invent numbers or claim unverified benchmarks.
      Output only the recommendation paragraph and the table. Do not write the opening
      interpretation line; the summariser adds it.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Produce a defensible SQLite-vs-PostgreSQL recommendation and a three-row
      risk table (risk, likelihood, mitigation) for the stated context.
    skills:
    - embedded database engineering
    - desktop app deployment
    - risk assessment
    - SQLite operational behaviour (WAL, backups, file corruption modes)
    - schema migration planning
    outputs:
    - artifact: Recommendation draft
      format: 'memo: recommendation paragraph (max ~120 words) plus markdown table
        Risk | Likelihood | Mitigation with exactly 3 data rows'
    success_criteria:
    - Recommends one database unambiguously.
    - Reasons tie to one user, one laptop and a client-delivered app.
    - The table has exactly 3 rows and each likelihood is a clear rating.
    - Every mitigation is an action the consultancy can implement.
    - Risks cover data loss/corruption, backup failure and migration/scaling limits,
      or fold them sensibly into three rows.
    - No re-interpretation of the app; no invented numbers.
    constraints:
    - Recommendation text must stay short.
    - Exactly three table rows.
    - Do not re-interpret the task's reading of the app.
    pool: []
    created_by: drafter
    temperature: 0.2
    max_tokens: 8192
