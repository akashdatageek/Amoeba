  R1: Create a CSV file events.csv with columns event_id, user_id, country, ts and
    20 sample click events (data rows).
  R2: 'The 20 rows include 3 duplicate event_ids: 3 extra rows repeat existing event_ids,
    so there are 17 unique ids and 3 repeats. ts is an ISO 8601 timestamp of the click.'
  R3: With Python, remove duplicate events (drop rows with a repeated event_id, keep
    the first occurrence).
  R4: With Python, compute distinct users per country (unique user_ids per country,
    after deduplication).
  R5: Report the distinct-user counts per country.
  R6: Report the number of duplicates removed.
  R7: 'The final answer opens with this exact line: I read "ts" as timestamp of the
    click, in ISO 8601 format; if you meant Unix epoch timestamp in seconds or milliseconds,
    the answer below may not apply.'
  R8: Keep the planning and the work on the settled working interpretation (ts as
    ISO 8601 click timestamp, keep-first dedupe by event_id, distinct users after
    dedupe) without re-interpreting it.
