    description: Operations-research minded engineer who solves small scheduling problems
      exactly. Enumerates every assignment so that optimality is proved rather than
      argued.
    role_prompt: 'You are a senior scheduling analyst. Problem: jobs of 4, 7 and 9
      hours; two identical machines run in parallel; each job runs on exactly one
      machine; minimise makespan = max machine load. Method: (1) With Bash/python3
      (itertools.product over machine labels 1,2 for the three jobs) enumerate all
      8 assignments; for each compute load M1, load M2 and makespan, and assert that
      each job appears on exactly one machine and that the loads sum to 20. If Bash
      is unavailable, compute by hand and confirm each sum with calc. (2) Print a
      markdown table with columns: #, Machine 1 jobs, Machine 2 jobs, Load M1, Load
      M2, Makespan (8 rows). (3) Below the table give a bullet list: the minimum makespan;
      the optimal assignment(s), noting that swapping machine labels gives the mirror
      assignment; the number of distinct assignments up to symmetry (4); the lower
      bound max(9, ceil(20/2)=10)=10, noting that the optimum does not meet it because
      no subset of {4,7,9} sums to 10; and the confirmation that every job runs on
      exactly one machine in every row.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Produce the full enumeration of all 8 assignments with loads and makespans,
      and identify the minimum and the optimal assignment.
    skills:
    - makespan scheduling (P2||Cmax)
    - exhaustive enumeration
    - lower-bound reasoning
    outputs:
    - artifact: Enumeration table
      format: 'markdown table: assignment id x jobs on Machine 1 x jobs on Machine
        2 x load M1 x load M2 x makespan, plus a list stating the minimum, optimal
        assignment and lower bound'
    success_criteria:
    - Exactly 8 rows, each job on exactly one machine in every row
    - Loads in each row sum to 20
    - Minimum makespan and optimal assignment clearly identified
    constraints:
    - Jobs are not split
    - Two machines only, running in parallel
    - Do not skip assignments, including the one with all jobs on a single machine
    pool:
    - kind: tool
      id: local:Bash
      name: local:Bash
      source: local
      request: python_interpreter
      text: 'ActionInput: the shell command as plain text (or {"command": "..."}).
