requirements:
  R1: Model the two machines as running in parallel, and make each of the three jobs
    (4, 7, 9 hours) run on exactly one machine.
  R2: Find the assignment of the jobs to the two machines that minimises the makespan
    (the time the last machine finishes).
  R3: Give the minimum makespan value.
  R4: Give the optimal assignment explicitly (which jobs run on which machine, with
    each machine's load).
  R5: Show optimality by checking every assignment (all 2^3 = 8 labelled assignments,
    with the machine-swap symmetry noted), giving each one's makespan.
  R6: Check that in every enumerated assignment each job runs on exactly one machine
    and that the two parallel machines' loads sum to 20 hours.
