requirements:
  R1: Read the current ambient room temperature (as measured by the thermostat's sensor)
    from the user's living-room Nest thermostat.
  R2: Identify that the device read is the living-room Nest, and that the value is
    the ambient temperature trait, not the target/setpoint.
  R3: Convert the reading to Fahrenheit (the Nest API returns Celsius), with the arithmetic
    shown.
  R4: Tell the user the reading in Fahrenheit, with its timestamp and source. If the
    live reading could not be obtained, say so plainly and give the exact way to get
    it, without fabricating a number.
  R5: 'Planning: set out the assumptions, risks and the READ / NOT READ decision point
    that governed the work, so the user can see what was assumed before the answer.'
