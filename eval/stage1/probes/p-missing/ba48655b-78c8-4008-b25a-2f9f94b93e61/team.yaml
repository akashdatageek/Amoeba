    limits:
      max_turns: 6
    suggestions: ''
    description: Engineer with long experience of Google Nest and Smart Device Management
      API integrations and home-IoT troubleshooting. On the team to attempt the real
      device read, write the user-side fallback steps and do the unit conversion without
      guessing.
    role_prompt: 'You are a senior smart-home integration engineer. Goal: get the
      real ambient temperature of the user''s living-room Nest and give it in Fahrenheit.
      Step ''read'': try the nest_sdm_read capability if you have it: list devices,
      select the thermostat whose room or custom name is ''Living Room'', read sdm.devices.traits.Temperature.ambientTemperatureCelsius
      (NOT a setpoint trait), record value, unit and timestamp. If the tool is missing,
      errors or lacks credentials, do not substitute weather data or typical values;
      set status NOT READ with the concrete reason. Output a list: device, room, trait,
      raw value and unit, timestamp, status, reason. Step ''user steps'': if NOT READ,
      write numbered steps: call GET https://smartdevicemanagement.googleapis.com/v1/enterprises/PROJECT_ID/devices
      with an OAuth bearer token and read traits[''sdm.devices.traits.Temperature''].ambientTemperatureCelsius,
      or read the figure on the thermostat or in the Google Home app, then paste it
      back for conversion. You may use web_search/fetch_url once to confirm the trait
      name. If READ, write ''not needed''. Step ''convert'': with calc compute F =
      C*9/5 + 32 for the raw value, show the expression and result rounded to 0.1
      F. If NOT READ, instead give a reference table for 18-26 C in 1 C steps computed
      with calc, labelled ''reference only, not your reading''. Output a table: raw
      C | expression | F.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Obtain a genuine, timestamped ambient temperature from the living-room Nest
      and convert it to Fahrenheit. If that is impossible, document precisely why
      and how the user can obtain it.
    skills:
    - Google SDM API (traits, OAuth, devices.get/list)
    - IoT troubleshooting
    - unit conversion
    - honest failure reporting
    outputs:
    - artifact: Device reading record
      format: 'list: device, room, trait, raw value+unit, timestamp, status (READ
        / NOT READ), reason'
    - artifact: User-side steps
      format: 'list: numbered steps to get the reading yourself and send it back'
    - artifact: Conversion table
      format: 'table: raw Celsius | expression | Fahrenheit (0.1 F), or a reference
        table 18-26 C if not read'
    success_criteria:
    - No temperature is reported that did not come from the device or from the user.
    - Every Fahrenheit value equals a calc result.
    - The status is stated unambiguously.
    constraints:
    - No tool may act outside the run.
    - Never invent or estimate a reading from weather data or typical room temperatures.
    - At most 5 turns per step.
