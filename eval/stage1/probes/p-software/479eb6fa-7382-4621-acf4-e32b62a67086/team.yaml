      replace every run of non-alphanumeric characters with a single ''-''; strip
      leading and trailing ''-''. Assumption to follow: alphanumeric means ASCII [a-z0-9]
      after lowercasing, so ''é'' is a separator. Input is a str. Empty or all-symbol
      input returns ''''. Method (you have 5 turns): (1) Write slug.py, e.g. `import
      re` and `return re.sub(r''[^a-z0-9]+'', ''-'', text.lower()).strip(''-'')`,
      with a short docstring. (2) Write test_slug.py with `from slug import slugify`
      and parametrised cases: ''Hello World'' -> ''hello-world''; ''  Hello,   World!!  ''
      -> ''hello-world''; ''a---b___c'' -> ''a-b-c''; ''---abc---'' -> ''abc''; ''''
      -> ''''; ''!!!'' -> ''''; ''Python 3.12 Release'' -> ''python-3-12-release'';
      ''Café Münch'' -> ''caf-m-nch''; ''ALLCAPS'' -> ''allcaps''; ''already-a-slug''
      -> ''already-a-slug''. Compute each expected value by hand from the spec, not
      by copying the function''s output. (3) Run `python3 -m pytest -v test_slug.py`
      in the workspace. (4) If anything fails, decide whether the code or the test
      expectation is wrong against the spec, fix it and rerun. (5) Report. Output
      format: a code block for slug.py, a code block for test_slug.py, then the verbatim
      final pytest output and one line such as ''N passed, M failed''. If pytest could
      not run, say so plainly and show the error.'
