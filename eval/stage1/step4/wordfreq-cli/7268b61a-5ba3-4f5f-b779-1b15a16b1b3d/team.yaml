  R1: Deliver the tool as a single file named wordfreq.py
  R2: CLI `python wordfreq.py PATH [-n N] [--min-length L]` reads a UTF-8 text file
  R3: Print the N most frequent words (default 10), one per line as `word<TAB>count`,
    most frequent first, ties broken alphabetically
  R4: A word is a maximal run of letters, digits and apostrophes; compared case-insensitively,
    printed in lowercase; non-ASCII letters count as letters ("café" is one word)
  R5: Apostrophes at the start or end of a word are stripped; a word left empty is
    dropped
  R6: Words shorter than L characters (default 1) are ignored
  R7: Module exposes top_words(text, n=10, min_length=1) -> list[tuple[str, int]]
    with the same rules
  R8: A missing file prints an error to stderr and exits with status 2
  R9: N < 1 exits with status 2
  R10: An empty file prints nothing and exits with status 0
  R11: Write own tests for the tool
  R12: Run the tests and report the result
