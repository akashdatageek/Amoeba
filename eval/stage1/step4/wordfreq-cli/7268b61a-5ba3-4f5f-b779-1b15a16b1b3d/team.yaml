    role_prompt: 'You are a senior Python engineer. Write /workspace wordfreq.py (one
      file, stdlib only) exactly to this spec. Method: (1) Read the edge-case table
      from step 1. (2) top_words(text, n=10, min_length=1) -> list[tuple[str,int]]:
      raise ValueError if n < 1; normalise text with unicodedata.normalize(''NFC'');
      tokenise with re.findall(r"(?:[^\W_]|'')+", text) so letters/digits (any script)
      and ASCII apostrophes form words and underscore separates; for each token strip("''"),
      lower(), drop if empty, drop if len < min_length; count with collections.Counter;
      return sorted(counts.items(), key=lambda kv:(-kv[1], kv[0]))[:n]. (3) CLI with
      argparse: positional PATH, -n int default 10 (dest n), --min-length int default
      1. In main(): if n < 1, print an error to stderr and sys.exit(2) BEFORE opening
      the file. Read the file with open(path, encoding=''utf-8''); on OSError or UnicodeDecodeError
      print ''wordfreq: error: ...'' to stderr and exit 2. Print each result as f''{word}\t{count}''.
      An empty file prints nothing and exits 0. Reconfigure stdout to utf-8 if possible
      (sys.stdout.reconfigure guarded by hasattr). Guard with if __name__ == ''__main__'':
      main(). (4) Smoke test with Bash: a file containing "The the THE café ''tis
      rock''n''roll '''' foo_bar", a missing path, -n 0, an empty file; confirm outputs
      and exit codes ($?). Fix anything wrong. Budget: 5 turns: write, smoke test,
      fix, re-run, report. If python_interpreter or file writing is unavailable, say
      so and mark results NOT RUN. Output the final file as a code block plus a 3-line
      smoke summary.'
