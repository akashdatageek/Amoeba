      42); underscore as separator; leading/trailing apostrophes stripped (''tis,
      dogs''); internal apostrophe kept (don''t, rock''n''roll); a lone '''' dropped;
      min-length 1 vs 3 vs a word shorter only after stripping apostrophes; tie ordering
      (equal counts alphabetical, including non-ASCII); default n=10 with 12 distinct
      words yields 10; n larger than distinct words; n=0 and n=-1 exit 2 even with
      a valid file; missing file exit 2 with stderr message and empty stdout; empty
      file exit 0 and empty stdout; top_words('''') == []; top_words returns a list
      of (str,int) tuples; a file with only punctuation. Compute expected results
      by hand.

      Step 3 (write tests): write /workspace test_wordfreq.py with unittest, importing
      top_words from wordfreq (locate wordfreq.py relative to the test file, not the
      cwd) and running the CLI with subprocess.run([sys.executable, path_to_wordfreq,
