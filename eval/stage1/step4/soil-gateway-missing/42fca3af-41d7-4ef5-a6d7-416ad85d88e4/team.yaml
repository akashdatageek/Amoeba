        \ on page {i+1}:\")\n            for row in table:\n                print(row)\n\
        ```\n\n#### Advanced Table Extraction\n```python\nimport pandas as pd\n\n\
        with pdfplumber.open(\"document.pdf\") as pdf:\n    all_tables = []\n    for\
        \ page in pdf.pages:\n        tables = page.extract_tables()\n        for\
        \ table in tables:\n            if table:  # Check if table is not empty\n\
