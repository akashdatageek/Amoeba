        ```\n\n#### Extract Metadata\n```python\nreader = PdfReader(\"document.pdf\"\
        )\nmeta = reader.metadata\nprint(f\"Title: {meta.title}\")\nprint(f\"Author:\
        \ {meta.author}\")\nprint(f\"Subject: {meta.subject}\")\nprint(f\"Creator:\
        \ {meta.creator}\")\n```\n\n#### Rotate Pages\n```python\nreader = PdfReader(\"\
        input.pdf\")\nwriter = PdfWriter()\n\npage = reader.pages[0]\npage.rotate(90)\
        \  # Rotate 90 degrees clockwise\nwriter.add_page(page)\n\nwith open(\"rotated.pdf\"\
        , \"wb\") as output:\n    writer.write(output)\n```\n\n### pdfplumber - Text\
        \ and Table Extraction\n\n#### Extract Text with Layout\n```python\nimport\
