plan:
- index: 0
  agent_ids:
  - 5c79a849-61d2-4949-bdf2-49c7fc570d3c
  text: '[IoT Data Engineer]: Build and run the ChirpStack pull and VWC analysis'
  kind: work
  covers:
  - R1
  - R2
  - R5
  - R6
  - R8
  depends_on: []
  do: 1) List the workspace and read any supplied readings or mapping files. 2) If
    the ChirpStack API client tool is available and a token is present, pull the last
    24h for the 12 Field 7 probes; otherwise write fetch_chirpstack.py (token from
    env CHIRPSTACK_TOKEN, VWC read from a configurable decoded payload key, no conversion)
    for on-site use. 3) Write analyse_vwc.py (per-probe mean, counts, coverage, exclusion
    of values outside 0-100, strict below-20 flag, LOW COVERAGE flag). 4) Run it on
    real data if available; else write probe_averages.csv with 12 rows marked NOT
    PULLED. 5) Write run_status.md with what was pulled, the payload key, the 24-hour
    window, and what is missing.
  output: 'table: probe_averages (12 probes x n_readings, coverage, avg VWC, below_20,
    status), plus code: the two scripts and a memo: run_status.md'
  done_when: probe_averages.csv has 12 probe rows with a status column, both scripts
    are written, and run_status.md says explicitly whether live data was pulled, which
    payload key is used for VWC, and lists the missing inputs.
  checks:
