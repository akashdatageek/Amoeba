requirements:
  R1: Retrieve ACS 1-year table B19013 median household income (all households) for
    Indiana and the United States for 2015 and 2023 (endpoints only), as published
    for each survey year.
  R2: Retrieve BLS CPI-U (CUUR0000SA0, U.S. city average, all items, not seasonally
    adjusted, 1982-84=100) annual averages for 2015 and 2023.
  R3: Compare real median household income for Indiana and the United States between
    2015 and 2023 in 2023 dollars (nominal × CPI2023 / CPIyear), with percentage change
    for both (real, and nominal for reference), and state which gained more in real
    terms.
  R4: Report the nominal values, the CPI-U values used, the adjusted values and the
    percentage changes for both Indiana and the United States.
  R5: Say why the ACS 1-year B19013 and CPI-U CUUR0000SA0 sources fit this comparison,
    including limitations (margins of error, national CPI applied to a state).
  R6: Deliver a CSV of the figures.
  R7: Deliver a bar chart as a PNG.
  R8: Cite every figure with its source (URL, table or series ID) and date (release
    year and retrieval date).
  R9: 'The final answer must open with the mandated line: I read "between 2015 and
    2023" as Endpoints only: 2015 and 2023; if you meant Every year from 2015 through
    2023, with change from 2015 to 2023, the answer below may not apply.'
  R10: Independently verify the retrieved figures, calculations, files, citations
    and dates before the final answer.
  R11: State plainly in the final answer which of Indiana and the United States gained
    more in real terms 2015 to 2023, and whether the gap is within ACS margins of
    error.
  R12: Use the ACS 1-year estimates of median household income (standard, not experimental)
    from table B19013, as published for each year, for the income data.
  R13: 'Keep the planning record: the objective, deliverables, formula, assumptions
    and risks fixed before retrieval are restated in the final answer as an Assumptions
    section.'
