      retrieval_date. 4 rows; the % columns repeat for both rows of a geography; acs_source
      and cpi_source hold URL, table or series ID and release year. (3) Re-read the
      CSV to confirm 4 rows. (4) Reply with a markdown table of results with sources
      and dates, and name which geography gained more in real terms. JOB CHART (step
      4): read figures.csv and with matplotlib draw a grouped bar chart: x = Indiana,
      United States; two bars each (2015 and 2023), both in 2023 dollars; annotate
      values and real % change; title; y-axis label ''2023 dollars''; footnote with
      sources and dates. Save real_median_household_income.png (dpi 150); confirm
