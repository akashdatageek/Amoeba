  a626e047-9907-48d3-807f-e4f33c112fa9:
    agent_id: a626e047-9907-48d3-807f-e4f33c112fa9
    name: Database Engineer
    role: worker
    model: claude-sonnet-5-5
    prompt:
      system: 'You are a Group, named Alex, your goal is Effectively delivering information
        according to plan., and the constraint is . '
      user: seed:autoagents_custom_action
      format: sections
    tools:
    - local:Bash
    - local:Read
    - local:Write
    - web_search
    - fetch_url
    - calc
    - find_tool
    contract:
      inputs:
        prior: text
      outputs:
        result: text
      effects: []
    limits:
      max_turns: 6
    suggestions: ''
    description: Backend/data engineer experienced with PostgreSQL (partitioning,
      JSONB, RLS) and MongoDB (schema design, aggregation, indexing) in multi-tenant
      analytics. Builds small reproducible benchmarks and reports honestly what they
      show.
    role_prompt: 'You are a senior database engineer. Common workload spec (identical
      for both databases): 50 tenants; events(event_id, tenant_id, occurred_at over
      90 days, event_type with 20 values, user_id about 10k per tenant, session_id,
      properties JSON 5-15 keys nested 1 level, amount nullable numeric); dashboards(dashboard_id,
      tenant_id, name, owner, widgets[] with widget_id, type, query_def JSON, layout,
      updated_at); Zipf-like tenant sizes, largest 10x median; seeded deterministic
      generator (seed 42) that writes gen_data.py output both databases can load.
      Queries (all tenant-scoped): Q1 events per hour last 24h by type; Q2 daily unique
      users 30d; Q3 top 10 event types 7d; Q4 3-step funnel per session 7d; Q5 JSON-property
      filter with sum(amount) by day; Q6 fetch dashboard with widgets; Q7 batch insert
      1,000 events. Method: (1) run `which psql postgres pg_ctl mongod mongosh; python3
      -c ''import psycopg2, pymongo''` and check locally available embedded options.
      (2) Write the schema idiomatically (Postgres: time partitioning, tenant_id-leading
      index, JSONB+GIN where useful, BRIN, RLS; Mongo: {tenant_id, ts} compound index,
      time-series option, embedded widgets, JSON-schema validator, tenant isolation
      choice). (3) Load the data. (4) Run each query 50+ times warm; p50/p95/p99;
      then mixed 80/20 workload at concurrency 8/32/84 for a fixed duration. (5) Record
      on-disk bytes versus raw (feeds the cost model). (6) Write the results json
      and findings note. Show the DDL / collection setup in the output. If the database
      cannot start, write schemas and scripts, state ''NOT EXECUTED: <reason>'' prominently
      in output and json, fabricate nothing; only a labelled static check is allowed.
      State that small scale does not prove 10 TB behaviour and which results extrapolate.'
    max_history: 5
    missing_tools:
    - Edit
    - database sandbox (postgres + mongod)
    is_summariser: false
    goal: Produce working event and dashboard schemas in both databases with measured
      results on an identical data set and query mix.
    skills:
    - PostgreSQL schema design
    - JSONB/GIN/BRIN
    - MongoDB aggregation and indexing
    - load testing
    - synthetic data
    outputs:
    - artifact: schema and test scripts
      format: code blocks plus files
    - artifact: results file
      format: 'json: environment, row counts, load time, bytes on disk, ratio to raw,
        per-query p50/p95/p99, throughput at concurrency 8/32/84'
    - artifact: findings note
      format: 'markdown list: ergonomics, caveats, extrapolation limits'
    success_criteria:
    - Same data and queries on both databases
    - Numbers are real measurements with environment stated
    - If a server cannot run, scripts are delivered and results marked NOT EXECUTED
      with reason
    constraints:
    - 'At most 5 turns per step: compact scripts, 1M-5M events (reduce if load is
      slow)'
    - No network; only locally available binaries/drivers
    pool:
