requirements:
  R1: Gather current, dated, cited benchmark results comparing PostgreSQL and MongoDB,
    with attention to analytics/multi-tenant workloads and vendor bias.
  R2: 'Gather current, dated, cited managed-service pricing on AWS and GCP: RDS/Aurora
    and Cloud SQL/AlloyDB for PostgreSQL, and MongoDB Atlas on AWS and GCP.'
  R3: Estimate the monthly cost for 50 tenants x 200 GB raw (10 TB) with a peak of
    5,000 queries per minute across all tenants, per provider and database, with low/base/high
    scenarios and stated assumptions.
  R4: Assess GDPR data-residency implications for EU tenants (regions, transfers,
    SCCs, sub-processors, backups, erasure, support access) for both databases and
    both clouds.
  R5: Prototype an event and dashboard schema in both PostgreSQL and MongoDB.
  R6: Test an event and dashboard schema in both PostgreSQL and MongoDB with a common
    data set and query workload, and report measured results (latency, throughput,
    storage footprint) with honest limits on scale.
  R7: Deliver a recommendation memo that chooses PostgreSQL or MongoDB, grounded in
    the benchmark, cost, GDPR and prototype evidence.
  R8: Include a risk table in the memo (risk, likelihood, impact, mitigation, owner).
  R9: Include a 90-day migration plan sized for a 12-person startup.
