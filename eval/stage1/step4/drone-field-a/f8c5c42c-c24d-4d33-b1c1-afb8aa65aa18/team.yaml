plan:
- index: 0
  agent_ids:
  - 174b0592-b148-4b7d-b42a-ec3e2ec93002
  text: '[Remote Sensing Analyst]: Compute NDVI, zone means, stressed zones; write
    map and CSV'
  kind: work
  covers:
  - R1
  - R2
  - R4
  - R5
  - R7
  - R8
  depends_on: []
  do: 1) Inspect red.png and nir.png (mode, shape, dtype, range, 60x90 alignment).
    2) Cast to float64, compute per-pixel NDVI, mask zero denominators. 3) Compute
    the six zone means with the fixed slices (columns = x east, rows = y south) and
    the field mean. 4) Flag stressed zones (<0.35, unrounded) and near-threshold cases.
    5) Write ndvi_map.png (colourbar, zone grid and labels, north at top), zones.csv
    (zone,mean_ndvi,stressed; 6 rows) and results.json. 6) Report the table, field
    mean, stressed list and an orientation line.
  output: 'table: zone x mean NDVI (4 dp) x stressed, plus the field mean, the stressed
    list and an orientation note (x east, y south); files zones.csv, ndvi_map.png,
    results.json'
  done_when: zones.csv has 6 rows with header zone,mean_ndvi,stressed; ndvi_map.png
    exists and is a valid image; the report lists all six zone means and the field
    mean to 4 dp; the stressed zones are listed (or none stated); the orientation
    note is present.
  checks:
  - name: file_exists
    params:
      kind: csv
      name: zones.csv
    covers:
    - R5
  - name: csv_columns
    params:
      names:
      - zone
      - mean_ndvi
      - stressed
    covers:
    - R5
  - name: csv_rows_min
    params:
      n: 6
    covers:
    - R1
    - R5
    - R8
  - name: file_exists
    params:
      kind: png
      name: ndvi_map.png
    covers:
    - R4
  - name: image_exists
    params:
      kind: png
      min_px: 60
    covers:
    - R4
  - name: output_mentions
    params:
      terms:
      - east
      - south
      - stressed
    covers:
    - R2
    - R7
- index: 1
  agent_ids:
  - 665991cf-02b7-41a2-9304-287e5334c782
  text: '[Route Optimisation Analyst]: Shortest closed scouting route and battery
    check'
  kind: work
  covers:
  - R3
  - R7
  depends_on:
  - 1
  do: 1) Read the stressed zones from results.json. 2) Map them to centres (x east,
    y south, metres). 3) Enumerate all permutations with depot (0,0) and compute closed
    tour lengths. 4) Pick the shortest (report ties and the reverse). 5) Give legs,
    total to 1 decimal and margin = 260 - length, stating within or exceeding. 6)
    Save route.json.
  output: 'table: leg x from x to x distance m, with total length, order and battery
    margin'
  done_when: The route order and total length (1 decimal) are stated; all permutations
    were enumerated; the battery verdict gives an explicit margin in metres.
  checks:
  - name: output_has_table
    params:
      min_rows: 2
    covers:
    - R3
  - name: output_mentions
    params:
      terms:
      - '260'
      - margin
    covers:
    - R3
    - R7
