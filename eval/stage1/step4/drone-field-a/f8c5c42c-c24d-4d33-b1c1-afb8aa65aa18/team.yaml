  agent_ids:
  - 44864b36-54cb-4caf-a9a1-e3c23c63d1f4
  text: '[Independent Verifier]: Independently verify numbers, files and route'
  kind: verify
  covers:
  - R1
  - R2
  - R3
  - R4
  - R5
  - R7
  - R8
  depends_on:
