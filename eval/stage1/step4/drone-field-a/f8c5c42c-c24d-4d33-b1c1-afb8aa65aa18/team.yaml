requirements:
  R1: Compute NDVI = (NIR - Red) / (NIR + Red) per pixel from inputs/red.png and inputs/nir.png
    (8-bit, aligned bands), and give the mean NDVI of each of the six zones and of
    the whole field to 4 decimals.
  R2: 'List the stressed zones: a zone is stressed when its mean NDVI is below 0.35.'
  R3: 'Find the shortest route for the scouting drone: it takes off from the NW corner
    (x 0, y 0), flies in straight lines over the centre of every stressed zone and
    lands back at that corner. Give the order and the length in metres to 1 decimal,
    and say whether it is within the 260 m battery limit and by how much.'
  R4: Deliver ndvi_map.png, the per-pixel NDVI map, with a colourbar and ideally zone
    boundaries and labels, north at the top.
  R5: 'Deliver zones.csv with one row per zone and columns: zone, mean NDVI, stressed.'
  R6: Deliver a short summary covering the zone and field means, the stressed zones,
    the route and the battery verdict.
  R7: 'Apply the coordinate convention throughout (map, zone slices, route): x runs
    east along the columns from the west edge and y runs south along the rows from
    the north edge. One pixel is 1 m x 1 m, and the origin (0,0) is the NW corner.'
  R8: 'Split the 90 x 60 pixel field into six 30 m x 30 m management zones in a 3
    x 2 grid, numbered row by row: Z1, Z2, Z3 on the north row (west to east) and
    Z4, Z5, Z6 on the south row.'
max_inner_turns: 3
