  do: 1) Recompute NDVI and zone/field means from the raw PNGs with a different implementation
    and compare at 4 dp. 2) Check the stressed list against the 0.35 rule and near-threshold
    cases. 3) Validate zones.csv, the zone layout (Z1-Z3 north, Z4-Z6 south) and ndvi_map.png
    (opens, not blank, north at top). 4) Recompute the route length and margin and
    the best alternative. 5) Issue the verdict.
  output: 'table: check x expected x found x pass/fail, ending with ''VERDICT: PASS''
