    the 3 x 2 zone grid and axis convention), and the delivered files. Use corrected
    values if the verifier found errors.'
  output: 'memo: Results, Stressed zones, Scouting route, Assumptions, Deliverables'
  done_when: The memo has a table of all six zone means and the field mean; it lists
    the stressed zones; it gives the route with length and margin; it names ndvi_map.png
    and zones.csv; it adds no new numbers.
  checks:
  - name: output_has_table
    params:
      min_rows: 6
    covers:
    - R1
    - R2
    - R6
    - R8
  - name: output_mentions
    params:
      terms:
      - Z1
      - Z6
      - stressed
      - '260'
      - ndvi_map.png
