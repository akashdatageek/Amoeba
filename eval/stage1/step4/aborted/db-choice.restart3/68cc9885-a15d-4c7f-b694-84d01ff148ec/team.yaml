requirements:
  R1: Gather current published third-party benchmark results (TPC, independent or
    vendor studies) for PostgreSQL vs MongoDB on analytics/event workloads, with URLs
    and dates
  R2: 'Gather current managed-service pricing: AWS RDS/Aurora PostgreSQL, GCP Cloud
    SQL/AlloyDB, MongoDB Atlas on AWS and GCP, with URLs and retrieval dates'
  R3: Estimate the monthly cost for 50 tenants x 200 GB (10 TB raw) at a peak of 5,000
    queries/min across all tenants, per provider and database, with assumptions and
    low/base/high scenarios
  R4: 'Assess GDPR data-residency implications for EU tenants: EU-region hosting on
    AWS/GCP and transfers outside the EU, for both databases'
  R5: Prototype an event schema and a dashboard schema in both PostgreSQL and MongoDB
    (shared database, tenant ID column/field)
  R6: 'Test the prototypes: load synthetic multi-tenant data, run dashboard and event
    queries and a tenant-isolation check on both databases, and record results'
  R7: Deliver a recommendation memo choosing PostgreSQL or MongoDB, grounded in the
    benchmark, cost, GDPR and prototype evidence
  R8: Include a risk table in the memo (risk, likelihood, impact, mitigation, owner)
  R9: Include a 90-day migration plan sized for a 12-person startup
  R10: 'The final answer opens with: I read "multi-tenant" as Shared database with
    a tenant ID column or tenant field; if you meant Separate schema or database per
    tenant, the answer below may not apply.'
max_inner_turns: 3
