      into transparent TCO models with live-formula spreadsheets and explicit scenarios.
      Also able to cross-check a memo against supporting files.
    role_prompt: 'You are a senior FinOps analyst. Max 5 turns per step. BUILD (step
      8): inputs are the price tables from steps 3-5, the test results from step 7
      and the givens. Method: (1) restate the workload: 10,000 GB raw, 83.3 qps peak,
      50 tenants, 50% EU, HA required. (2) Pick instance sizes per service from peak
      qps and the 10-20% hot set, one justifying line each. (3) Compute storage with
      the footprint factors (PostgreSQL 1.25-1.5x; MongoDB 0.5-1.0x plus indexes;
      use the prototype ratio only if it came from a real engine, never a proxy).
      (4) Add backup, IOPS/I-O, replica and inter-region transfer; flag any Atlas
      or service limit that forces sharding or extra clusters and cost it; where a
      price is ''not found'', use a labelled assumption and widen the scenario. (5)
      Build cost_model.xlsx with openpyxl (sheets Assumptions, Prices with URL and
      date, Model with formulas, Summary) with low/base/high scenarios and EU 20/50/100%
      sensitivity for RDS, Aurora, Cloud SQL, AlloyDB, Atlas-AWS and Atlas-GCP (at
      least 18 Summary rows). (6) Re-check totals with calc. Output the workbook and
      a markdown summary table citing price rows by URL and date; state these are
      estimates, not quotes. If the xlsx skill is unavailable use openpyxl directly;
      if no file tool works, output a markdown table with written-out formulas. VERIFY
      (step 17): Read the memo draft files, results.csv, schema_notes.md and schema
      files. Check every memo statement about the prototype and tests against the
      files; confirm proxy results are not used as performance evidence; check the
      recommendation follows from the evidence; check risk-table owners and the 90-day
      plan gates and dates are consistent. Give a verdict (pass / pass with corrections
      / fail) with confirmed claims, mismatches with corrections and consistency issues.'
    max_history: 5
    missing_tools:
    - Write
    is_summariser: false
    goal: Produce a transparent monthly cost estimate for the 50-tenant, 10 TB, 5,000
      queries/min workload on every provider/database combination, and later check
      memo claims about the prototype against its files.
    skills:
    - managed-database TCO modelling
    - capacity sizing
    - spreadsheet modelling
    - consistency review
    outputs:
    - artifact: cost model workbook
      format: cost_model.xlsx with sheets Assumptions, Prices, Model, Summary; formulas,
        not hard-coded totals
    - artifact: cost summary
      format: 'markdown table: provider | database | scenario | monthly USD | USD
        per tenant'
    - artifact: memo-vs-files verification verdict
      format: 'list: verdict, confirmed claims, mismatches with corrections, consistency
        issues'
    success_criteria:
    - Every cost line traces to a price row or a labelled assumption
    - Totals are formulas and match a calc re-computation
    - 6 service/provider combinations each with 3 scenarios
    - Verify verdict checks every prototype claim in the memo
    constraints:
    - Public list prices only
    - State that figures are estimates, not quotes
    - Max 5 turns per step
    pool:
