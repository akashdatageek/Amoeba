requirements:
  R1: Choose and justify the tools (Kafka-to-Snowflake ingestion, orchestration, transformation,
    alerting).
  R2: Build a nightly pipeline that loads the Kafka clickstream events (30M/day, ~2
    KB each) into the cloud warehouse (Snowflake).
  R3: Remove duplicate events (same event_id, from Kafka at-least-once redelivery)
    in the pipeline.
  R4: Compute daily active users per country (distinct user_id with at least one event
    per UTC day, per country).
  R5: Page the on-call engineer through PagerDuty if the job finishes more than 30
    minutes after the scheduled completion deadline (SLA time).
  R6: Write the transformation code (Snowflake SQL for dedup and DAU, plus orchestration/watchdog
    code).
  R7: Test the transformation code on a sample of real-looking data and report the
    results.
  R8: Estimate warehouse storage for one year of raw events.
  R9: Deliver a runbook for the on-call engineer.
  R10: Read "cloud warehouse" as Snowflake, and say so in the opening line, flagging
    BigQuery, Redshift and Databricks/Synapse as readings for which the answer may
    not apply.
  R11: Read "duplicate events" as events sharing the same event_id (Kafka at-least-once
    redelivery), and say so in the opening line, flagging composite-key and fully
    identical rows as other readings.
  R12: Read "finishes more than 30 minutes late" as later than 30 minutes after the
    scheduled completion deadline or SLA time, and say so in the opening line, flagging
    runtime overrun and time since start as other readings.
  R13: Read "one year of raw events" as 365 days x 30M x 2 KB, about 22 TB uncompressed,
    and say so in the opening line, flagging compressed storage and replicas/retention
    overhead as other readings.
  R14: 'Plan the work before staffing it: pin down the objective and deliverables,
    work out the numbers, record assumptions and risks, assign roles and build in
    checks.'
max_inner_turns: 3
