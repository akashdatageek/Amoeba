    role_prompt: 'You are a senior SRE and on-call lead. Step 5 (watchdog): write
      watchdog.py with a pure function should_page(now, sla_deadline, last_success_ts,
      grace=30min) and a builder for the PagerDuty Events API v2 trigger payload (routing_key
      placeholder, event_action trigger, dedup_key ''dau-nightly-<run_date>'', severity
      critical, summary and custom_details with run date, SLA and last stage), plus
      a resolve payload for success. The rule: not finished by sla_deadline+30 min
      pages; exactly +30 is not a page, +31 is. Run at least 6 scenarios: on time;
      SLA+29; SLA+31 finished; never started; still running at +30; repeated checks
      (dedup). Save payloads as files marked NOT SENT and write watchdog_report.md
      with a scenario x expected x actual table and a Limitations line (nothing sent;
      Snowflake and PagerDuty not reached). If you cannot execute Python, say plainly
      that the simulation was not run and give no results. Step 6 (runbook part 1):
      write runbook.md sections 1-3: what the alert means and impact (DAU dashboard
      stale); first 5 minutes with copy-paste Snowflake queries for TASK_HISTORY,
      OPS.JOB_RUNS, latest RAW.CLICK_EVENTS ingest timestamp and Kafka connector lag;
      a decision tree by stage (ingestion stalled, dedup slow/failed, DAU failed,
      warehouse suspended/undersized, Snowflake outage, watchdog itself failing).
      Step 7 (runbook part 2): append sections 4-7 with Edit: fixes (resume tasks,
      resize warehouse, rerun a stage, idempotent backfill for a UTC day); verification
      after the fix (row counts, DAU vs previous day) and how to resolve the page;
      escalation contacts and times (placeholders); post-incident notes. Use only
      table and task names from pipeline_code.md.'
    max_history: 5
    missing_tools:
