  text: '[Fuel Data Sourcing Researcher]: Fetch the EIA Midwest diesel history and
    extract the 52 latest weeks'
  kind: work
  covers:
  - R1
  - R9
  - R13
  depends_on: []
  do: 1) fetch_url the EIA weekly Midwest (PADD 2) No. 2 diesel retail price history
    page. If the newest week is older than the latest release, fetch the EIA weekly
    update page or run one web_search to check for it. 2) Record series ID, units,
    release date and retrieved_date. 3) Extract the 52 latest weekly values with Monday
    dates and check 7-day spacing. 4) Save raw_eia_extract.txt listing every value,
    its date and the source URL, and note any missing week.
  output: raw_eia_extract.txt with 52 (or fewer, with gaps named) dated weekly values,
    series ID, units, release date, source URL and retrieved_date
  done_when: The extract file exists, shows the series ID, URL, release date and retrieved
    date, and states whether the newest week matches the latest release or which week
    is missing.
