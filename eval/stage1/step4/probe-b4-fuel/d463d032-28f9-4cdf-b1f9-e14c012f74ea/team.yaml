        behind, which reads as a stray empty bullet when it was auto-numbered:


        - `pandoc --track-changes=accept` never joins the paragraphs.

        - `accept_changes.py` (LibreOffice) joins them correctly, except when the
        deleted paragraph is followed by an empty spacer paragraph.


        An empty bullet in either view is an artifact of that view, not a defect in
        the document. Check paragraph deletions in the XML.


