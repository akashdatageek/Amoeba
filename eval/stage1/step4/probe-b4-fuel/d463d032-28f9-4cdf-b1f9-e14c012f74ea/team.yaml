requirements:
  R1: Get the weekly retail on-highway diesel price (EIA Midwest PADD 2 as the Indiana
    proxy) for the 52 latest weekly releases, citing the series ID and the Monday
    date of each price.
  R2: Compute, for each of the 52 weeks, the fuel surcharge per mile = (price - 1.25)
    / 6.2 rounded to the cent, and the fleet's total weekly fuel cost.
  R3: Find the latest ATRI 'An Analysis of the Operational Costs of Trucking' total
    marginal cost per mile and the fuel share (fuel cost per mile / total marginal
    cost per mile, %).
  R4: Compare the ATRI fuel cost per mile and fuel share with the carrier's average
    fuel cost per mile over the 52 weeks.
  R5: Deliver an Excel workbook with weekly price, surcharge and fleet fuel cost,
    built with live formulas.
  R6: Deliver a PNG line chart of price and surcharge over the 52 weeks.
  R7: Deliver a Word memo of at most 2 pages.
  R8: The memo gives the surcharge for each 5-cent price band from $3.00 to $5.00,
    plus the average, highest and lowest week, and the ATRI comparison.
  R9: The memo gives the source and date of every figure and states any figure that
    could not be obtained and what was used instead (including the Midwest-for-Indiana
    proxy).
  R10: The final answer opens with the mandated interpretation line about the Midwest
    (PADD 2) proxy.
  R11: 'Run the fleet model on the carrier''s stated operation: 35 Class 8 tractors
    averaging 6.2 mpg and about 2,300 miles per week each, based in Indianapolis,
    Indiana.'
  R12: Plan and deliver a fuel-surcharge schedule for the carrier's shippers, together
    with a picture of the carrier's fuel cost over the past year.
  R13: Read 'weekly retail on-highway diesel price for Indiana' as the EIA weekly
    Midwest (PADD 2) on-highway diesel price used as a proxy for Indiana, and state
    this in the data files, the memo and the final answer.
max_inner_turns: 3
