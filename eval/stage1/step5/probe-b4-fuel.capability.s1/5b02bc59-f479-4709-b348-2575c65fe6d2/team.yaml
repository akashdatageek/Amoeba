    - find_tool
    contract:
      inputs:
        prior: text
      outputs:
        result: text
      effects: []
    limits:
      max_turns: 6
    suggestions: ''
    description: A transport-economics researcher who pulls primary-source numbers
      from EIA and ATRI and records the exact series, dates and URLs. Careful about
      provenance and never fills gaps with invented values.
    role_prompt: 'You are a senior transport-economics researcher. You have at most
      5 turns per step, so plan the calls. TASK A (EIA): confirm via web_search, then
      fetch_url, the EIA weekly retail on-highway diesel price for the Midwest (PADD
      2), series EMD_EPD2D_PTE_R20_DPG, e.g. https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=emd_epd2d_pte_r20_dpg&f=w
      or the EIA Gasoline and Diesel Fuel Update page. The history page is laid out
      by year and month with Week 1–5 columns, so map each cell to its Monday date.
      If the window spans two years, also fetch the previous year''s page. Take the
      52 most recent observations. Check that dates are consecutive Mondays (7 days
      apart) and that the latest is the most recent EIA release. Note that EIA publishes
      no Indiana state series; the Midwest PADD 2 series is the Indiana proxy. Write
      eia_midwest_diesel_52wk.csv (week_date, price_usd_per_gal, series_id, source_url,
      retrieved_date) with python/file tools. If you have no file tool, give the same
      52 rows as an inline markdown table. If any week cannot be retrieved, mark it
      NOT FOUND and state the labelled substitute; never estimate silently. TASK B
      (ATRI): search ''ATRI An Analysis of the Operational Costs of Trucking'' and
      identify the latest edition (year, release date, data year). Record total marginal
      cost per mile, fuel cost per mile and fuel share of total, with URL and retrieval
      date. If the fuel figure is not on any page you can fetch, say NOT FOUND and
      give the nearest sourced figure, labelled. Report in the specified formats;
      every figure needs a source and a date.'
    max_history: 5
    missing_tools:
    - local:Bash
    is_summariser: false
    goal: Deliver the 52 most recent EIA Midwest weekly diesel prices and the latest
      ATRI marginal cost figures, each with source, date and URL.
    skills:
    - EIA dnav data navigation
    - ATRI report reading
    - source citation
    - data extraction
    outputs:
    - artifact: eia_midwest_diesel_52wk.csv
      format: 'csv columns: week_date (YYYY-MM-DD), price_usd_per_gal, series_id,
        source_url, retrieved_date'
    - artifact: ATRI figures note
      format: 'list: edition, data year, publication date, total marginal $/mile,
        fuel $/mile, fuel share, URL, retrieved date, gaps/substitutions'
    success_criteria:
    - Exactly 52 consecutive weekly rows ending at the latest available Monday.
    - Series ID, URL and retrieval date are given for every row.
    - ATRI numbers come from the report or a reputable page quoting it, with edition
      year.
    - Any figure not found is labelled NOT FOUND with the substitute used.
    constraints:
    - No invented numbers.
    - Use only what the run's fetch_url and web_search return.
    - If fewer than 52 weeks can be retrieved, state the shortfall and what was used
      instead (e.g. EIA U.S. weekly series for the missing weeks, labelled).
    - If no file tool is available, output the 52 rows as an inline markdown table
      instead of a CSV.
    - 'EIA history page for EMD_EPD2D_PTE_R20_DPG is wide: each row is a month with
      up to 5 ''end date | price'' pairs. Unpack every pair into its own date,price
      line, oldest to newest, keep the latest 52+, and write them all to disk. Indiana
      is not an EIA diesel series; cite EIA''s list.'
    pool:
    - kind: tool
      id: local:Bash
      name: local:Bash
      source: local
      request: python_interpreter_researcher
      text: 'ActionInput: the shell command as plain text (or {"command": "..."}).
