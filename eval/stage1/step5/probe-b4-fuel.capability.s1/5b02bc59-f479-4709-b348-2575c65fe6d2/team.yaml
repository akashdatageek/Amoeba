      per step. WORKBOOK STEP: read the EIA CSV and the ATRI note. With openpyxl build:
      Inputs sheet (labelled cells tractors=35, miles_per_tractor_week=2300, mpg=6.2,
      base=1.25); Weekly sheet with columns week_date, price, series_id, surcharge_per_mile
      =ROUND((price-Inputs!base)/Inputs!mpg,2), fleet_miles, gallons, fleet_fuel_cost
      =gallons*price, fuel_cost_per_mile =price/mpg, optional surcharge_revenue; Bands
      sheet: lower bound 3.00 to 4.95 step 0.05, label like $3.00–$3.049, surcharge
      =ROUND((lower-base)/mpg,2), plus a ''$5.00 and above'' row at 5.00 (41 rows);
      Summary sheet: AVERAGE, MAX, MIN of price with INDEX/MATCH dates, total 52-week
      fuel cost, average fuel cost per mile (total cost ÷ total miles), ATRI total
      and fuel per mile and fuel share (values with edition, URL, date), differences
      in $ and %; Sources sheet: every source, series ID, URL, retrieval date, the
      Midwest-as-Indiana-proxy note, gaps and substitutions. Verify the files exist
      and the xlsx has formulas. KEY-FIGURES STEP: compute everything independently
      in Python with Decimal ROUND_HALF_UP from the CSV (never Python''s round), write
      key_figures.json (average/high/low week with dates and surcharge, totals, 41
      bands, carrier fuel $/mile, ATRI comparison, sources) and compare it with the
      workbook''s formula logic (recalculate with LibreOffice if available, otherwise
      re-evaluate the formulas in Python). CHART STEP: matplotlib line chart, price
      on the left axis ($/gal) and surcharge on the right axis ($/mile) against week
      date; title naming the EIA Midwest PADD 2 series; legend; footnote ''EIA, retrieved
      <date>''; dpi 150, at least 1200 px wide. Check the PNG size with Bash. No invented
      numbers; carry any NOT FOUND labels through.'
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Produce the formula-driven workbook, key_figures.json and the PNG chart.
    skills:
    - Excel modelling with openpyxl
    - formula design
    - matplotlib charting
    - fleet fuel economics
    outputs:
    - artifact: fuel_surcharge_workbook.xlsx
      format: xlsx with formulas
    - artifact: key_figures.json
      format: 'json: average/high/low week with dates, band table, totals, carrier
        fuel $/mile, ATRI comparison, sources'
    - artifact: price_surcharge_chart.png
      format: png, at least 1200 px wide
    success_criteria:
    - Weekly sheet has 52 data rows with date, price, series ID, ROUND surcharge formula,
