requirements:
  R1: Get the weekly retail on-highway diesel price for the most recent 52 weeks from
    EIA (Midwest PADD 2 as the Indiana proxy). Cite the series ID and the week date
    of every price.
  R2: For each of the 52 weeks, compute the fuel surcharge per mile = ROUND((price
    − 1.25) ÷ 6.2, 2) and the fleet's total fuel cost for that week.
  R3: Find the latest ATRI 'An Analysis of the Operational Costs of Trucking' average
    marginal cost per mile and the share of it that is fuel (fuel $/mile component).
    Compare them with the carrier's average fuel cost per mile over the 52 weeks.
  R4: Deliver an Excel workbook with the weekly price, surcharge and fleet fuel cost,
    using live formulas.
  R5: Deliver a PNG line chart of price and surcharge over the 52 weeks.
  R6: Deliver a Word memo of at most 2 pages that gives the average, highest and lowest
    week, the ATRI comparison, and the source and date of every figure.
  R7: State any figure that could not be obtained and what was used instead. Never
    invent data.
  R8: Open the final answer with the mandated interpretation line (both readings,
    with the alternatives under which the answer may not apply).
  R9: The carrier runs 35 Class 8 tractors (heavy-duty semi tractors over 33,000 lb
    GVWR) that average 6.2 mpg and about 2,300 miles per week each. Base the fuel-surcharge
    schedule and the fuel-cost picture on this fleet, with 35, 2,300, 6.2 and the
    $1.25 base as live input cells.
  R10: Give the surcharge for each 5-cent price band from $3.00 to $5.00 (bands $3.00–3.049,
    $3.05–3.099 … up to $5.00), computed at each band's lower bound, in the workbook
    (with formulas) and in the memo.
  R11: Read 'weekly retail on-highway diesel price for Indiana' as EIA's Midwest (PADD
    2) weekly retail on-highway diesel price, used as the Indiana proxy because EIA
    does not publish a state-level Indiana series. Disclose this in the workbook Sources
    sheet, the memo and the final answer.
  R12: Read '5-cent price band from $3.00 to $5.00' as bands $3.00–3.049, $3.05–3.099
    and so on up to $5.00, with the surcharge at each band's lower bound. Disclose
    this in the memo and the final answer.
  R13: 'In the opening line, name the alternative readings under which the answer
    may not apply: an Indiana-specific weekly series, if one exists (e.g., a Midwest
    sub-series or a state-level listing), or the EIA U.S. national average as the
    fallback; discrete $0.05 price points (41 rows) or a band-midpoint surcharge.'
  R14: 'Plan the delivery before building it: record assumptions, open questions and
    risks; have an independent reviewer check numbers, sources and files; and report
    the verdict and any unresolved defects in the final answer.'
