    covers:
    - R1
    - R2
  - name: output_has_table
    params:
      min_rows: 6
    covers:
    - R1
    - R2
  - name: output_mentions
    params:
      terms:
      - east
      - south
      - stressed
    covers:
    - R2
    - R8
    - R9
