requirements:
  R1: Compute per-pixel NDVI = (NIR - Red)/(NIR + Red) from inputs/red.png and inputs/nir.png,
    and give the mean NDVI of each of the six 30 x 30 m zones (Z1-Z3 north row W-E,
    Z4-Z6 south row W-E) and of the whole field, each to 4 decimals.
  R2: List the stressed zones (zone mean NDVI < 0.35).
  R3: Find the shortest route that starts at the NW corner (0,0), flies in straight
    lines over the centre of every stressed zone and lands back at (0,0). Give the
    visiting order and the total length in metres to 1 decimal.
  R4: State whether the route is within the 260 m battery limit and by how many metres
    (margin or excess).
  R5: Deliver ndvi_map.png, an image of the NDVI map.
  R6: Deliver zones.csv with one row per zone and columns zone, mean NDVI, stressed.
  R7: Deliver a short summary covering the zone means, field mean, stressed zones,
    route, length and battery verdict.
  R8: Treat x as running east along the columns from the west edge (column 0 = west
    edge, x = 0 at the west edge) in the zone slicing, the map and the route coordinates.
  R9: Treat y as running south along the rows from the north edge (row 0 = north edge,
    y = 0 at the north edge) in the zone slicing, the map (north at top, no vertical
    flip) and the route coordinates.
max_inner_turns: 3
