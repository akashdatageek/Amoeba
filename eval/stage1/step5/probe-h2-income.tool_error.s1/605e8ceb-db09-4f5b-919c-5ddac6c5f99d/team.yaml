requirements:
  R1: 'Open the final answer with the exact line: I read "between 2015 and 2023" as
    Every year from 2015 through 2023, inclusive; if you meant Only the two endpoint
    years, 2015 and 2023, the answer below may not apply.'
  R2: 'Compare real median household income for Indiana and the United States between
    2015 and 2023, expressed in 2023 dollars: side by side for every year, with the
    Indiana-to-U.S. gap and the change over the period.'
  R3: Use the U.S. Census Bureau's American Community Survey 1-year estimates (standard
    release) of median household income, table B19013 (B19013_001E estimate and _001M
    margin of error), for Indiana and the United States for every year 2015-2023;
    flag 2020 as experimental-only (no standard 1-year release because of pandemic
    nonresponse).
  R4: Use the BLS CPI-U, U.S. city average, all items, not seasonally adjusted, 1982-84=100,
    annual average (series CUUR0000SA0) for 2015-2023 as the inflation measure.
  R5: Compute real median household income in 2023 dollars for each year and both
    geographies (nominal x CPI_2023 / CPI_year).
  R6: Compute the percentage change from 2015 to 2023 for Indiana and the U.S., both
    nominal and real.
  R7: Report the nominal values, the CPI-U values used, the adjusted values and the
    percentage changes for both geographies.
  R8: 'Say why these sources fit (ACS B19013 and CPI-U CUUR0000SA0), including their
    limits: the 2020 gap, ACS margins of error, ACS values being in each survey year''s
    dollars, national rather than Indiana-specific CPI.'
  R9: Deliver a CSV of the figures.
  R10: Deliver a bar chart as a PNG.
  R11: Cite every figure with its source and date (data vintage and retrieval date).
  R12: Verify the figures, sources and calculations independently before delivery.
  R13: 'Plan the work before staffing it: pin down the objective and deliverables,
    work out the numbers, and record the assumptions, formulas, rounding rules, risks
    and checks (the planning record) so that the deliverable states them.'
