    - Chart has a title with '2023 dollars', labelled axes, a legend and a source
      footnote with retrieval date
    constraints:
    - 'No network in the sandbox: use only the supplied values'
    - 'Never invent a missing value: leave it blank with a note'
    - At most 5 turns per step
    - If Bash or file writing is not granted, print the CSV text and the chart script
      inline and state clearly that the files were not rendered
    pool:
