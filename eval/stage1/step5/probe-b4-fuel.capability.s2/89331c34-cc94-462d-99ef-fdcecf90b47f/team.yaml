requirements:
  R1: Get the weekly retail on-highway diesel price for the 52 most recent weeks from
    EIA (Midwest PADD 2 proxy for Indiana). Cite the series and the week of each price.
  R2: For each of the 52 weeks, compute the fuel surcharge per mile as ROUND((price
    - 1.25) / 6.2, 2) and the fleet's total fuel cost for that week.
  R3: Find the latest ATRI average marginal cost per mile (from its latest 'An Analysis
    of the Operational Costs of Trucking' report) and the share of it that is fuel.
    Compare it with the carrier's average fuel cost per mile over the 52 weeks.
  R4: Deliver an Excel workbook with weekly price, surcharge and fleet fuel cost,
    using live formulas.
  R5: Deliver a PNG line chart of price and surcharge over the 52 weeks.
  R6: Deliver a Word memo of at most 2 pages.
  R7: The memo gives the surcharge for each 5-cent price band from $3.00 to $5.00,
    the average, highest and lowest week, and the ATRI comparison.
  R8: The memo gives the source and date of every figure.
  R9: State any figure that could not be obtained and what was used instead (including
    the Midwest-for-Indiana proxy).
  R10: The final answer opens with the mandated line, which reads 'weekly retail on-highway
    diesel price for Indiana' as the EIA weekly Midwest (PADD 2) price used as a proxy.
  R11: Independently verify the data, the spreadsheet formulas, the statistics, the
    ATRI figures, the citations and the deliverables (workbook, chart, memo) before
    the final assembly.
  R12: 'Plan on the fleet basis stated in the task: 35 Class 8 tractors (GVWR over
    33,000 lb) at 6.2 mpg and about 2,300 miles per week each. Write the assumptions
    down (constant weekly gallons, midpoint band convention, surcharge on every mile)
    in the workbook Inputs sheet and the memo.'
  R13: Report the ATRI report's title, release date and cost data year, and flag that
    its period and national scope differ from the carrier's 52 EIA weeks.
max_inner_turns: 3
