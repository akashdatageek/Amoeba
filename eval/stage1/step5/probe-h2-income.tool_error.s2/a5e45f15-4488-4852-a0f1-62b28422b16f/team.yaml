requirements:
  R1: Gather the standard ACS 1-year table B19013 median household income, with margin
    of error, for Indiana and the United States for 2015 and 2023, as published in
    each survey year's own dollars (the nominal values).
  R2: Gather the BLS CPI-U, U.S. city average, all items, NSA (CUUR0000SA0) annual-average
    values for 2015 and 2023.
  R3: Compute real median household income in 2023 dollars for both geographies using
    CPI_2023 / CPI_year, on the endpoints 2015 and 2023 only.
  R4: Report, for Indiana and the United States, the nominal values, the CPI-U values
    used, the adjusted values and the percentage change between 2015 and 2023 (real
    as the headline, nominal for reference).
  R5: Say why the ACS B19013 1-year estimates and the CPI-U annual average fit this
    comparison, including limitations.
  R6: Deliver a CSV file of the figures.
  R7: Deliver a bar chart as a PNG.
  R8: Cite every figure with its source (URL or table ID) and date (release date and
    retrieval date).
  R9: 'Open the final answer with the required interpretation line, word for word:
    I read "between 2015 and 2023" as Endpoints only (2015 and 2023), with percentage
    change computed between them; if you meant Every year from 2015 to 2023, with
    percentage change from 2015 to 2023, the answer below may not apply.'
  R10: 'Verify the figures independently: recompute the arithmetic and check the sourced
    values against a second source before the answer is assembled.'
  R11: 'Compare real median household income for Indiana and the United States between
    2015 and 2023: state side by side which grew more in real terms, and whether the
    gap is larger than the sampling error.'
  R12: Use only standard ACS 1-year estimates of median household income; note that
    the standard 2020 1-year estimates were not published (only experimental estimates),
    so 2020 is not used.
  R13: 'Plan before staffing: the objective, deliverables, givens, assumptions, risks
    and checks are recorded and carried into the final method note.'
