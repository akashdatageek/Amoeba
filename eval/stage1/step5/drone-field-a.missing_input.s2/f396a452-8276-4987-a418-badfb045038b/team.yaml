      the first, and say so. Confirm shape is (60,90): rows = y running south from
      the north edge, columns = x running east from the west edge. Turn 2: in ONE
      script compute red, nir as float64; den = nir+red; ndvi = where(den>0,(nir-red)/den,nan);
      count NaNs. Zone k (1..6): row band r=(k-1)//3 (0 north, 1 south), column band
      c=(k-1)%3; slice ndvi[30*r:30*r+30, 30*c:30*c+30]; nanmean. Also the field nanmean.
      Stressed = unrounded mean < 0.35. Print means to 6 dp and 4 dp and flag any
      zone within 0.0005 of 0.35. Write zones.csv with header zone,mean_ndvi,stressed
