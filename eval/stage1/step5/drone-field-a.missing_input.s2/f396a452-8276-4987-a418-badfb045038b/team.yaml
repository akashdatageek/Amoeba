plan:
- index: 0
  agent_ids:
  - cd4a6c5a-f785-4e97-a166-d540aacbeebf
  text: '[Remote Sensing Analyst]: Compute NDVI, zone means, stressed zones; write
    csv and map'
  kind: work
  covers:
  - R1
  - R2
  - R4
  - R5
  - R7
  - R8
  depends_on: []
  do: 1) Read inputs/red.png and inputs/nir.png; print shape, channels, dtype and
    range; confirm 60 rows x 90 columns (rows = y south from the north edge, columns
    = x east from the west edge) and scale to DN 0-255. 2) Compute NDVI in float64
    with NaN where NIR+Red=0 and report the NaN count. 3) Compute mean NDVI for Z1..Z6
    (north row Z1-Z3, south row Z4-Z6, west to east, 30x30 slices) and the whole field.
    4) Flag stressed zones on the unrounded mean < 0.35, noting any within 0.0005
    of the threshold. 5) Write zones.csv (zone,mean_ndvi,stressed; 6 rows; 4 dp) and
    ndvi_map.png (heatmap, colorbar, zone grid and labels, axes in metres). 6) Re-read
    both files to confirm.
  output: 'table: zone | mean NDVI (4 dp) | unrounded | stressed; plus field mean
    line, NaN count, an orientation line (columns = x east, rows = y south) and the
    stressed zone list'
  done_when: 'zones.csv has 6 data rows and the three headers; ndvi_map.png is a valid
    PNG; the table shows six zone means and the field mean to 4 dp; the stressed list
    and the columns/rows orientation are stated.; it must include: Step 1''s stressed-zone
    list. The step 1 text was truncated, so the zones were recomputed from inputs/red.png
    and nir.png.; stressed-zone list'
  checks:
  - name: file_exists
    params:
      kind: csv
      name: zones.csv
    covers:
    - R5
  - name: file_exists
    params:
      kind: png
      name: ndvi_map.png
    covers:
    - R4
  - name: csv_columns
    params:
      names:
      - zone
      - mean_ndvi
      - stressed
    covers:
    - R5
  - name: csv_rows_min
    params:
      n: 6
    covers:
    - R5
    - R1
  - name: output_has_table
    params:
      min_rows: 6
    covers:
    - R1
    - R2
  - name: output_mentions
    params:
      terms:
      - columns
      - rows
      - east
      - south
    covers:
    - R7
    - R8
- index: 1
  agent_ids:
  - b060d334-ee4d-46f7-babb-8f6fdf80b1ab
  text: '[Route Optimisation Analyst]: Shortest closed route over stressed zone centres
    and battery verdict'
  kind: work
  covers:
  - R3
  depends_on:
  - 1
  do: 1) Take the stressed zones from step 1. 2) Map them to centres (Z1 (15,15),
    Z2 (45,15), Z3 (75,15), Z4 (15,45), Z5 (45,45), Z6 (75,45)). 3) Enumerate all
    permutations for the closed tour from (0,0); pick the minimum; note ties and the
    reverse direction. 4) Output the leg table, total to 1 dp, and margin = 260 -
    total. 5) Check the total is <= 218.647 and spot-check two legs with calc.
  output: 'table: leg | from | to | length m; with lines for route order, total length
    (1 dp), battery limit 260 m and margin'
  done_when: The route order and total length to 1 decimal are given; the battery
    verdict says within or exceeds with the margin in metres; the total is at most
    218.6 m.
  checks:
  - name: output_has_table
    params:
      min_rows: 2
    covers:
    - R3
  - name: output_mentions
    params:
      terms:
      - route
      - battery
      - '260'
    covers:
    - R3
- index: 2
  agent_ids:
  - 13c92f01-6a73-4e5a-8200-579f67457583
  text: '[QA Verifier]: Independent recomputation and file verification'
  kind: verify
  covers:
  - R1
  - R2
  - R3
  - R4
  - R5
  - R7
  - R8
  depends_on:
  - 1
  - 2
  do: 1) Recompute NDVI, zone and field means from the PNGs with a separate script
    and different slicing, confirming columns = x east and rows = y south. 2) Compare
    with step 1 values (tolerance 0.00005) and the stressed flags. 3) Re-read zones.csv
    (rows, headers, values, flags) and open ndvi_map.png to confirm validity. 4) Independently
    brute-force the route and compare order, total (0.05 m) and margin. 5) Write the
    verdict and list any discrepancy with the correct value.
  output: 'memo: Verdict (PASS/FAIL), comparison table recomputed vs reported, file
    checks, discrepancies'
  done_when: An explicit verdict is stated; a comparison table covers the zone means,
    field mean, stressed list, route total and margin; both deliverable files are
    confirmed valid.
  checks:
  - name: verdict_present
    params: {}
    covers:
    - R1
    - R2
    - R3
    - R4
    - R5
    - R7
    - R8
