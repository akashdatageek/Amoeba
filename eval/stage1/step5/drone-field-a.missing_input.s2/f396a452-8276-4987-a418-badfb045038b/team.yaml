  - 2
  - 3
  do: 'Combine the verified results (with any verifier corrections) into the short
    summary: zone means table, field mean, stressed zones, route order and length,
    battery verdict and margin, the deliverable files, assumptions and caveats.'
  output: 'memo: Results, Stressed zones, Route and battery, Deliverables, Assumptions
    and caveats'
  done_when: The summary has the means table with the field mean, the stressed list,
    the route with its length and margin, both file names and the assumptions, all
    matching verified values.
  checks:
  - name: output_has_table
    params:
      min_rows: 6
    covers:
    - R1
    - R2
  - name: output_has_list
    params:
      min_items: 1
    covers:
    - R2
  - name: output_mentions
    params:
      terms:
      - ndvi_map.png
      - zones.csv
      - battery
      - stressed
    covers:
    - R3
    - R4
    - R5
    - R6
requirements:
  R1: Compute NDVI = (NIR - Red) / (NIR + Red) per pixel from inputs/red.png and inputs/nir.png
    (8-bit, aligned bands), and give the mean NDVI of each of the six zones (Z1..Z6)
    and of the whole field to 4 decimals.
  R2: 'List the stressed zones: a zone is stressed when its mean NDVI is below 0.35.'
  R3: Find the shortest route for the scouting drone that takes off from the north-west
    corner (x 0, y 0), flies in straight lines over the centre of every stressed zone
    and lands back at that corner. Give the order and the length in metres to 1 decimal,
    and say whether it is within the 260 m battery limit and by how much.
  R4: Deliver ndvi_map.png, the NDVI map of the 90 x 60 pixel field.
  R5: Deliver zones.csv with one row per zone and the columns zone, mean NDVI, stressed.
  R6: Deliver a short summary covering the zone and field means, the stressed list,
    the route with its length and battery verdict, and the assumptions.
  R7: 'Treat x as running east along the columns from the west edge: column index
    = x, and x = 0 is the west edge.'
  R8: 'Treat y as running south along the rows from the north edge: row index = y,
    and y = 0 is the north edge. The zone numbering is row by row, Z1, Z2, Z3 on the
    north row (west to east) and Z4, Z5, Z6 on the south row.'
max_inner_turns: 3
