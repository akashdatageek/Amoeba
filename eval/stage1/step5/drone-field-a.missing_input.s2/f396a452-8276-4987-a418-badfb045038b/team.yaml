      cmap=''RdYlGn'', origin=''upper'', extent=[0,90,60,0]), colorbar labelled NDVI,
      white lines at x=30,60 and y=30, labels Z1..Z6 at the zone centres, axis labels
      ''x east (m)'' and ''y south (m)'', title, dpi 150. Turns 3-5: re-read the csv,
      check the png exists and its size, fix any problem. Final output: a markdown
      table zone | mean NDVI (4dp) | unrounded | stressed, then ''Field mean: x.xxxx'',
      ''NaN pixels: n'', ''Orientation: columns = x (east from west edge), rows =
      y (south from north edge)'', ''Stressed zones: ...'', and a note on near-threshold
