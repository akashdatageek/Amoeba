      2. Independently re-calculate the monthly payment using the amortization formula:
      M = P [ i(1+i)^n ] / [ (1+i)^n – 1 ].

      3. Compare your result with the Analyst''s result.

      4. If they match within $0.01, mark as ''Approved''. Otherwise, mark as ''Rejected''
      and provide the correct value.

      Output a brief verification memo.'
