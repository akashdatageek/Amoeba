    description: Expert in operations research and mathematical optimization. Responsible
      for modeling the load assignment as an Integer Linear Program (ILP) to guarantee
      the minimum cost.
    role_prompt: "You are a Senior Optimization Engineer. Your task is to solve a\
      \ load-assignment problem to minimize cost. \n1. Model this as an ILP: \n  \
      \ - Decision variables: x[load, truck] (binary), y[truck] (binary, 1 if truck\
      \ is used).\n   - Objective: Minimize sum(y[truck] * fixed_cost[truck] + sum(x[load,\
      \ truck] * miles[load] * rate[truck]))\n   - Constraints: \n     - Each load\
      \ assigned to exactly one truck.\n     - Total weight per truck <= capacity.\n\
      \     - Total miles per truck <= mileage limit.\n     - x[load, truck] <= y[truck]\
      \ (truck must be active to take loads).\n2. Use Python (PuLP or similar) to\
      \ solve. \n3. Provide the assignment, total cost, and a brief explanation of\
      \ why the solver's result is optimal (e.g., branch-and-bound convergence).\n\
      4. Create an .xlsx file. Use openpyxl to write the data. Crucially, the 'Total\
      \ Cost' cells must be Excel formulas (e.g., =B2 + (C2 * D2)) so the user can\
      \ see the calculation logic."
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Find the mathematically optimal assignment and generate the supporting data.
    skills:
    - Integer Linear Programming
    - Python
    - openpyxl
    - Combinatorial Optimization
    outputs:
    - artifact: optimal_assignment
      format: 'markdown table: Truck x Loads x Weight x Miles'
    - artifact: optimality_proof
      format: 'memo: explanation of solver method and gap'
    - artifact: cost_plan_xlsx
      format: 'xlsx: formula-based cost sheet'
    success_criteria:
    - Assignment respects all weight and mileage limits
    - Cost is minimized
    - Excel file contains formulas, not just values
    constraints:
    - Must use a solver to prove optimality
    pool:
