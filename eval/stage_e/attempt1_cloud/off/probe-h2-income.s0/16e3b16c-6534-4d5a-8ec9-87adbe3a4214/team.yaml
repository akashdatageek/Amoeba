requirements:
  R1: Gather nominal median household income for Indiana (2015-2023) from U.S. Census
    Bureau survey estimates.
  R2: Gather nominal median household income for the United States (2015-2023) from
    U.S. Census Bureau survey estimates.
  R3: Gather a stated official price index from BLS for inflation (2015-2023).
  R4: Report the nominal values for Indiana and the United States (2015-2023).
  R5: Calculate real median household income for Indiana (2015-2023) expressed in
    2023 dollars.
  R6: Calculate real median household income for the United States (2015-2023) expressed
    in 2023 dollars.
  R7: Report the adjusted values for Indiana and the United States (2015-2023).
  R8: Calculate the percentage change in real income for Indiana (2015 to 2023).
  R9: Calculate the percentage change in real income for the United States (2015 to
    2023).
  R10: Say which survey was used and why.
  R11: Say which price index was used and why.
  R12: Deliver a CSV of the figures.
  R13: Deliver a bar chart (PNG) comparing the real incomes.
  R14: Cite every figure.
max_inner_turns: 3
