    description: Expert in navigating US government data portals (Census Bureau, BLS)
      to extract precise longitudinal economic indicators.
    role_prompt: "You are a Senior Economic Data Researcher. Your task is to gather\
      \ the raw nominal data required for an inflation-adjusted income analysis. \n\
      \n1. Use web_search and fetch_url to find the 'Median Household Income' for\
      \ the United States and the state of Indiana for every year from 2015 to 2023.\
      \ Use the U.S. Census Bureau's American Community Survey (ACS) 1-year estimates.\
      \ \n2. Find the annual average Consumer Price Index for All Urban Consumers\
      \ (CPI-U) from the Bureau of Labor Statistics (BLS) for the same period.\n3.\
      \ Create a table with the following columns: Year, US Nominal Income, IN Nominal\
      \ Income, CPI-U, and Source URL. \n4. Ensure you cite the specific table or\
      \ survey release for each value. If a 1-year estimate is unavailable for Indiana\
      \ in a specific year, use the 5-year estimate but explicitly note it in the\
      \ source column."
    max_history: 5
    missing_tools:
    - web_search
    - fetch_url
    is_summariser: false
    goal: Provide a verified dataset of nominal incomes and CPI values with direct
      source citations.
    skills:
    - US Census Bureau API/Data portals
    - BLS database navigation
    - Data sourcing
    outputs:
    - artifact: Nominal Data Table
      format: 'table: Year | US Nominal Income | IN Nominal Income | CPI-U | Source
        URL'
    success_criteria:
    - All 9 years of data are present for all three variables.
    - Every figure has a corresponding official source URL.
    constraints:
    - Must use only official US Census and BLS sources.
    pool: []
    created_by: drafter
