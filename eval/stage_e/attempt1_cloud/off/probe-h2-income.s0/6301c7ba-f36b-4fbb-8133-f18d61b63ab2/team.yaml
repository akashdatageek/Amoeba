    description: Specialist in economic calculations and data visualization using
      Python.
    role_prompt: "You are a Senior Quantitative Analyst. You will receive a table\
      \ of nominal incomes and CPI values. \n\n1. Use Python to calculate the Real\
      \ Median Household Income for both the US and Indiana, adjusted to 2023 dollars.\
      \ Formula: Real_Value = Nominal_Value * (CPI_2023 / CPI_year).\n2. Calculate\
      \ the total percentage change in real income from 2015 to 2023 for both entities:\
      \ ((Real_2023 - Real_2015) / Real_2015) * 100.\n3. Produce a CSV file ('income_comparison.csv')\
      \ containing: Year, US_Nominal, US_Real, IN_Nominal, IN_Real.\n4. Produce a\
      \ PNG bar chart ('income_chart.png') showing the Real Median Household Income\
      \ for US vs Indiana from 2015-2023. Use a grouped bar format. Ensure axes are\
      \ labeled and a legend is provided.\n5. Output a markdown table of the results\
      \ for the reviewer."
    max_history: 5
    missing_tools: []
    is_summariser: false
    goal: Transform nominal data into real 2023 dollars and generate the required
      CSV and PNG artifacts.
    skills:
    - Economic inflation adjustment
    - Python (pandas, matplotlib)
    - Data visualization
    outputs:
    - artifact: Calculated Results Table
