requirements:
  R1: Gather nominal median household income for Indiana (2015-2023) from U.S. Census
    Bureau survey estimates.
  R2: Gather nominal median household income for the United States (2015-2023) from
    U.S. Census Bureau survey estimates.
  R3: Gather an official price index from the BLS for inflation adjustment (2015-2023).
  R4: Calculate real median household income for Indiana and the US, expressed in
    2023 dollars.
  R5: Calculate the percentage change in real income from 2015 to 2023 for both Indiana
    and the US.
  R6: Report nominal values, adjusted values, and percentage change.
  R7: State and justify which survey and which price index were used.
  R8: Deliver a CSV file containing all figures.
  R9: Deliver a bar chart (PNG) comparing the real incomes.
  R10: Cite every figure used.
max_inner_turns: 3
