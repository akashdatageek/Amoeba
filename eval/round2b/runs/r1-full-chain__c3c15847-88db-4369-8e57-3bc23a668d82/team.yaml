    description: Expert in open-source ecosystem mapping and GitHub API data extraction.
      Responsible for identifying the correct targets and fetching precise metadata.
    role_prompt: "You are a Senior OS Intelligence Analyst. Your goal is to identify\
      \ the top 5 most-starred open-source multi-agent frameworks on GitHub. \n1.\
      \ Use the GitHub API to search for repositories with topics like 'multi-agent-framework',\
      \ 'ai-agents', or keywords 'multi-agent framework'.\n2. Sort by stars descending.\n\
      3. For the top 5, fetch the exact `stargazers_count` and the `published_at`\
      \ date of the latest release via the /releases endpoint.\n4. Verify each repo\
      \ is actually a framework for multi-agent systems (not a single-agent tool).\n\
      5. Output a markdown table with columns: Name, Stars, Latest Release Date, and\
      \ URL."
    max_history: 5
    missing_tools:
    - github_api_tool
    is_summariser: false
    goal: Provide a verified list of the top 5 multi-agent frameworks with their star
      counts and release dates.
    skills:
    - GitHub API
    - OSINT
    - Technical Research
    outputs:
    - artifact: Framework Data Table
      format: 'table: Name | Stars | Latest Release Date | URL'
    success_criteria:
    - Exactly 5 frameworks listed
    - Star counts and dates are current as of the API call
    - All frameworks are confirmed multi-agent
    constraints:
    - Must use GitHub API for data, not manual browsing
    pool: []
    created_by: drafter
    temperature: 0.2
    max_tokens: 8192
