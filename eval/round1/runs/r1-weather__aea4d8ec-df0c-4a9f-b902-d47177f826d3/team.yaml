  text: '[Weather Data Specialist]: Fetch Chicago Weather'
  kind: work
  covers:
  - R1
  - R2
  depends_on: []
  do: '

    - Search for current weather in Chicago

    - Search for the 3-day forecast for Chicago

    - Extract the high temperature for today and the next 3 days'
  output: 'list: Day (Date) - High Temp (F)'
  done_when: A list of 4 dates and their corresponding high temperatures in Fahrenheit
    is produced.
- index: 1
  agent_ids:
  - e9dd5912-2394-4fd9-a15c-59ffdffac8c6
  text: '[Data Analyst]: Convert Temperatures to Celsius'
  kind: work
  covers:
  - R3
  depends_on:
  - 1
  do: '

    - For each temperature in the list, calculate (F - 32) * 5/9

    - Format the results into a table'
  output: 'table: Day | High (F) | High (C)'
  done_when: A table containing the original Fahrenheit and converted Celsius values
    for all 4 days is produced.
- index: 2
  agent_ids:
  - e2277188-7ed3-446f-a982-c721acd5283f
  text: '[Weather Data Specialist]: Verify Conversions'
  kind: verify
  covers:
