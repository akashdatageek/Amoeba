    - If ''Pass'', format the verified table from the Data Analyst into the final
    deliverable memo

    - If ''Fail'', output a failure warning'
  output: 'memo: Chicago Weather Forecast (Current + 3 Days)'
  done_when: The final report is delivered containing the current weather and 3-day
    forecast with Celsius highs, or a failure warning is issued.
