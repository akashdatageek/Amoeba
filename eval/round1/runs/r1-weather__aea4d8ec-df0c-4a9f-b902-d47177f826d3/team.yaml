    - Spot-check the conversion math for the entries using the formula and the ''calc''
    tool

    - Confirm the Fahrenheit values in the table match the raw data from step 1'
  output: 'memo: Verification result (Pass/Fail)'
  done_when: The specialist confirms the analyst's table is mathematically accurate
    and based on the correct source data.
- index: 3
