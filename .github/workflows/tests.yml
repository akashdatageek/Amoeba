name: tests

on:
  push:
    branches: [main]      # PR commits run once, via pull_request
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,local]"   # local: D59 document libraries for local:Bash
      - run: ./clone_sources.sh          # T11 compares the prompt files with the cited source lines
      - run: pytest -q                   # T1-T11 + test_diagram_sync, all offline
