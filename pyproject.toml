[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amoeba"
version = "0.1.0"
description = "Amoeba Phase 1: Task -> Plan a new team -> Team runs the task"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "openai>=1.50", "mcp>=2.2"]   # mcp: D56 pool tools

[project.scripts]
amoeba = "amoeba.cli:main"   # D56: amoeba pool refresh

[project.optional-dependencies]
test = ["pytest"]
# D59: preinstalled for --local-tools (python3 in the sandboxed workspace); never installed at run time
local = ["openpyxl", "python-docx", "python-pptx", "matplotlib", "pypdf"]

[tool.setuptools.packages.find]
include = ["amoeba*", "scripts*"]

[tool.setuptools.package-data]
"amoeba.config.prompts" = ["*.txt"]
"amoeba.config" = ["*.yaml"]          # prices.yaml, models.yaml (D54), pool.yaml (D56)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
