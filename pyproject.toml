[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amoeba"
version = "0.1.0"
description = "Amoeba Phase 1: Task -> Plan a new team -> Team runs the task"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "openai>=1.50"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["amoeba*", "scripts*"]

[tool.setuptools.package-data]
"amoeba.config.prompts" = ["*.txt"]
"amoeba.config" = ["*.yaml"]          # prices.yaml, models.yaml (D54)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
