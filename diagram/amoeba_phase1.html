<title>Amoeba Phase 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f7f8f6; --ink:#1d221f; --muted:#5d665f; --line:#8c948e;
    --llm-fill:#ece8f7; --llm-line:#6b5bb5;
    --code-fill:#e3f1e8; --code-line:#2f7d57;
    --data-fill:#fff7e3; --data-line:#b8860b;
    --plain-fill:#ffffff; --plain-line:#8c948e;
    --p1:#1f5fbf; --p1-fill:#e3ecfa; --hover:#d7e4fa;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15181a; --ink:#e8ebe7; --muted:#a3aba5; --line:#6b736d;
    --llm-fill:#2b2544; --llm-line:#a798e8;
    --code-fill:#1d3328; --code-line:#6cc596;
    --data-fill:#3a3115; --data-line:#e2b94a;
    --plain-fill:#20252a; --plain-line:#6b736d;
    --p1:#8fb6f5; --p1-fill:#1c2a40; --hover:#26385a;
  }}
  :root[data-theme="dark"]{
    --bg:#15181a; --ink:#e8ebe7; --muted:#a3aba5; --line:#6b736d;
    --llm-fill:#2b2544; --llm-line:#a798e8;
    --code-fill:#1d3328; --code-line:#6cc596;
    --data-fill:#3a3115; --data-line:#e2b94a;
    --plain-fill:#20252a; --plain-line:#6b736d;
    --p1:#8fb6f5; --p1-fill:#1c2a40; --hover:#26385a;
  }
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;padding-block:24px;padding-inline:16px;margin:0}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin:0 0 4px;text-wrap:balance}
  .sub{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:72ch}
  .legend{display:flex;flex-wrap:wrap;gap:12px 20px;font-size:13px;margin:0 0 12px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .sw{width:22px;height:14px;border-radius:3px;border:1.5px solid;display:inline-block}
  .sw.llm{background:var(--llm-fill);border-color:var(--llm-line)}
  .sw.code{background:var(--code-fill);border-color:var(--code-line)}
  .sw.data{background:var(--data-fill);border-color:var(--data-line)}
  .crumb{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13.5px;min-height:32px}
  .crumb button{font:inherit;font-weight:600;color:var(--p1);background:var(--p1-fill);border:1.5px solid var(--p1);border-radius:6px;padding:5px 12px;cursor:pointer}
  .crumb button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
  .crumb .here{color:var(--muted)}
  .panel{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--plain-fill)}
  svg{display:block;min-width:900px;width:100%;height:auto;font-family:"IBM Plex Sans",system-ui,sans-serif}
  [hidden]{display:none!important}
  .box{stroke-width:1.5}
  .box.llm{fill:var(--llm-fill);stroke:var(--llm-line)}
  .box.code{fill:var(--code-fill);stroke:var(--code-line)}
  .box.data{fill:var(--data-fill);stroke:var(--data-line)}
  .box.plain{fill:var(--plain-fill);stroke:var(--plain-line)}
  .t{fill:var(--ink);font-size:13.5px;font-weight:600}
  .t2{fill:var(--ink);font-size:12px;font-weight:600}
  .s{fill:var(--muted);font-size:11px}
  .src{fill:var(--muted);font-size:10px;font-family:"IBM Plex Mono",monospace}
  .arrow{stroke:var(--line);stroke-width:1.6;fill:none}
  .arrow.loop{stroke:var(--llm-line)}
  .lbl{fill:var(--muted);font-size:11px}
  .hd{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em}
  .group{fill:none;stroke:var(--line);stroke-dasharray:6 4;stroke-width:1.2}
  /* clickable top-level boxes */
  .hit{cursor:pointer}
  .hit rect.big{fill:var(--p1-fill);stroke:var(--p1);stroke-width:3;transition:fill .15s}
  .hit:hover rect.big,.hit:focus-visible rect.big{fill:var(--hover)}
  .hit:focus-visible{outline:none}
  .hint{fill:var(--p1);font-size:11px;font-weight:600}
  .open{fill:var(--p1);font-size:10.5px;font-weight:600;letter-spacing:.05em}
  .notes{margin-top:14px;font-size:13.5px;line-height:1.5;color:var(--muted);max-width:90ch}
  @media (prefers-reduced-motion: reduce){ .hit rect.big{transition:none} }
  .tt{position:fixed;z-index:50;max-width:420px;background:var(--plain-fill);color:var(--ink);border:1.5px solid var(--p1);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .18s ease;transform:translateY(2px)}
  .tt.on{opacity:1;transform:none}
  .tt b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--p1);margin-bottom:4px}
  .tt dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 10px}
  .tt dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--p1);font-weight:600;padding-top:1px}
  .tt dd{margin:0}
  .tt dd.c{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--code-line)}
  .tt code{font-family:"IBM Plex Mono",monospace;font-size:11.5px}
  .tip{cursor:pointer}
  .glyph{fill:var(--p1);font-size:13px;cursor:pointer}
  .glyph:hover{font-weight:700}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
  .ed{background:var(--plain-fill);color:var(--ink);border:1.5px solid var(--p1);border-radius:10px;width:min(560px,100%);padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .ed h2{font-size:14px;margin:0 0 4px}
  .ed .box-id{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin:0 0 10px}
  .ed textarea{width:100%;min-height:120px;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);box-sizing:border-box;resize:vertical}
  .ed .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;align-items:center;flex-wrap:wrap}
  .ed .st{margin-right:auto;font-size:12.5px;color:var(--muted)}
  .btn{font:inherit;font-weight:600;border-radius:6px;padding:6px 14px;cursor:pointer;border:1.5px solid var(--p1);background:var(--p1-fill);color:var(--p1)}
  .btn.primary{background:var(--p1);color:#fff}
  .btn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
  .queue{margin-left:auto;display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
  .tip:focus-visible{outline:none}
  .tip:hover rect.box,.tip:focus-visible rect.box{stroke-width:2.5}
  @media (prefers-reduced-motion: reduce){ .tt{transition:none} }
</style>
<div class="wrap">
  <h1>Amoeba Phase 1 — three boxes</h1>
  <p class="sub">Task → Plan a new team → Team runs the task. Click a box to see what is inside it; use Back to return.</p>
  <div class="legend">
    <span><i class="sw llm"></i>an AI writes text</span>
    <span><i class="sw code"></i>plain code decides</span>
    <span><i class="sw data"></i>data passed along</span>
    <span><code style="font-family:'IBM Plex Mono',monospace;font-size:12px">group.py:75</code> = the original file and line this comes from</span>
  </div>
  <div class="crumb" id="crumb"></div>

  <svg width="0" height="0" style="position:absolute;min-width:0" aria-hidden="true">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
      <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--llm-line)"/></marker>
    </defs>
  </svg>
  <div class="panel">

  <!-- ================= OVERVIEW ================= -->
  <svg id="v-overview" viewBox="0 0 1180 300" role="img" aria-label="Phase 1 overview: Task, Plan a new team, Team runs the task">
    <text x="30" y="40" class="hd">PHASE 1 · what gets built first</text>

    <g class="hit tip" tabindex="0" role="button" data-view="task" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;One job to do. For practice jobs we also know the right answer, so the system can grade itself.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;A sentence from you, or one generated toy task&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;A Task record&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;If it fails&lt;/dt&gt;&lt;dd&gt;A task with no known answer runs but gets no score&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/models.py · task/source.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;Task(id, prompt, family, ground_truth, tags)&lt;/dd&gt;&lt;dt&gt;Later&lt;/dt&gt;&lt;dd&gt;Phase 2: real tasks and an AI judge for tasks without a known answer&lt;/dd&gt;&lt;/dl&gt;" aria-label="Open Task">
      <rect x="30" y="70" width="230" height="120" rx="8" class="big"/>
      <text x="145" y="102" text-anchor="middle" class="t">1 · Task</text>
      <text x="145" y="122" text-anchor="middle" class="s">a prompt, plus the right answer</text>
      <text x="145" y="137" text-anchor="middle" class="s">when we have one (toy tasks)</text>
      <text x="145" y="176" text-anchor="middle" class="open">CLICK TO OPEN ▸</text>
    </g>

    <g class="hit tip" tabindex="0" role="button" data-view="plan" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;An AI drafts a team and a step plan for this job; two other AIs criticise it; the drafter revises. Then plain code checks the draft and builds the team.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;Task.prompt + the list of allowed tools&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;TeamConfig: helpers with ids, prompts, tools; step plan; who talks to whom&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;AI drafts, plain code decides what is accepted&lt;/dd&gt;&lt;dt&gt;Limits&lt;/dt&gt;&lt;dd&gt;3 rounds · 3 AI calls per round · 2–5 helpers&lt;/dd&gt;&lt;dt&gt;If it fails&lt;/dt&gt;&lt;dd&gt;Bad JSON is skipped; a step naming nobody is dropped; a tool we don&amp;#x27;t have is recorded as a capability request, not dropped; too few roles → DraftError&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/draft.py · task/instantiate.py — mirrors AutoAgents manager.py, environment.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;draft_team() → Draft → instantiate() → TeamConfig&lt;/dd&gt;&lt;dt&gt;Later&lt;/dt&gt;&lt;dd&gt;Phase 2: look in memory first and reuse a stored team&lt;/dd&gt;&lt;/dl&gt;" aria-label="Open Plan a new team">
      <rect x="360" y="70" width="290" height="120" rx="8" class="big"/>
      <text x="505" y="102" text-anchor="middle" class="t">2 · Plan a new team</text>
      <text x="505" y="122" text-anchor="middle" class="s">Planner + Agent Observer + Plan Observer,</text>
      <text x="505" y="137" text-anchor="middle" class="s">up to 3 rounds, then code builds the team</text>
      <text x="505" y="156" text-anchor="middle" class="src">AutoAgents drafting</text>
      <text x="505" y="176" text-anchor="middle" class="open">CLICK TO OPEN ▸</text>
    </g>

    <g class="hit tip" tabindex="0" role="button" data-view="run" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;The helpers do the job, either step by step (flat) or one writer plus reviewers (boss + reviewers). Every AI call is written to a log.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;TeamConfig + Task&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;Answer, score, trace.jsonl, capability_requests.json, result.json&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;AIs do the work; plain code routes messages and stops loops&lt;/dd&gt;&lt;dt&gt;Limits&lt;/dt&gt;&lt;dd&gt;flat: 5 turns per step · boss: 3 review rounds&lt;/dd&gt;&lt;dt&gt;If it fails&lt;/dt&gt;&lt;dd&gt;Turns run out → the last output is kept and error=&amp;#x27;max_turns&amp;#x27;; a last step answered BLOCKED → error=&amp;#x27;blocked&amp;#x27;&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;interp/runtime.py · interp/trace.py — mirrors AutoAgents group.py, AgentVerse vertical_solver_first.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;Interpreter.run(cfg, task, seed) → Episode&lt;/dd&gt;&lt;dt&gt;Later&lt;/dt&gt;&lt;dd&gt;Phase 3: a monitor reads the trace and can change the team mid-run&lt;/dd&gt;&lt;/dl&gt;" aria-label="Open Team runs the task">
      <rect x="750" y="70" width="290" height="120" rx="8" class="big"/>
      <text x="895" y="102" text-anchor="middle" class="t">3 · Team runs the task</text>
      <text x="895" y="122" text-anchor="middle" class="s">2–5 helpers, flat or boss + reviewers</text>
      <text x="895" y="137" text-anchor="middle" class="s">every AI call is traced</text>
      <text x="895" y="156" text-anchor="middle" class="src">AutoAgents / AgentVerse</text>
      <text x="895" y="176" text-anchor="middle" class="open">CLICK TO OPEN ▸</text>
    </g>

    <path d="M260 130 H360" class="arrow" marker-end="url(#ah)"/>
    <text x="310" y="122" text-anchor="middle" class="lbl">Task</text>
    <path d="M650 130 H750" class="arrow" marker-end="url(#ah)"/>
    <text x="700" y="122" text-anchor="middle" class="lbl">TeamConfig</text>
    <path d="M1040 130 H1090" class="arrow" marker-end="url(#ah)"/>

    <rect x="1090" y="105" width="70" height="50" rx="6" class="box plain"/>
    <text x="1125" y="134" text-anchor="middle" class="t2">Answer</text>

    <rect x="30" y="220" width="1130" height="52" rx="6" class="box data"/>
    <text x="45" y="242" class="t2">What every run leaves behind (raw material for Phase 2's memory box)</text>
    <text x="45" y="260" class="src">runs/&lt;run_id&gt;/  team.yaml · plan.json · trace.jsonl (every AI call; tokens recorded, not enforced) · capability_requests.json · result.json</text>
  </svg>

  <!-- ================= BOX 1: TASK ================= -->
  <svg id="v-task" viewBox="0 0 1180 330" role="img" aria-label="Inside Task" hidden>
    <text x="30" y="36" class="hd">INSIDE BOX 1 · TASK</text>

    <g class="tip" tabindex="0" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;Makes practice tasks whose answers we already know, the same ones every time for a given seed.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;seed, how many&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;Task records with ground_truth&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;Limits&lt;/dt&gt;&lt;dd&gt;3 task families in Phase 1&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/source.py · llm/toy_mock.py (a scripted stand-in model that solves these families offline, so the CLI runs without a key)&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;ToyTaskSource(seed, n) · random.Random(seed)&lt;/dd&gt;&lt;dt&gt;Later&lt;/dt&gt;&lt;dd&gt;more families, then real tasks&lt;/dd&gt;&lt;/dl&gt;">
    <rect x="30" y="70" width="200" height="100" rx="6" class="box code"/>
    <text x="130" y="94" text-anchor="middle" class="t">Toy task source</text>
    <text x="130" y="110" text-anchor="middle" class="s">seeded, repeatable</text>
    <text x="130" y="124" text-anchor="middle" class="s">arithmetic chains</text>
    <text x="130" y="138" text-anchor="middle" class="s">string transforms · JSON extraction</text>
    <text x="130" y="160" text-anchor="middle" class="src">task/source.py</text>
    </g>

    <g class="tip" tabindex="0" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;A task you type yourself. It runs normally but cannot be graded.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;a string from the command line&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;Task(family=&amp;#x27;freeform&amp;#x27;, ground_truth=None)&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;scripts/run_task.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;Task(id=uuid, prompt=text, family=&amp;#x27;freeform&amp;#x27;)&lt;/dd&gt;&lt;/dl&gt;"freeform", ground_truth=None). It runs like any other task but score stays None.">
    <rect x="30" y="200" width="200" height="60" rx="6" class="box plain"/>
    <text x="130" y="226" text-anchor="middle" class="t">Free-text task</text>
    <text x="130" y="244" text-anchor="middle" class="s">typed on the command line</text>
    </g>

    <g class="tip" tabindex="0" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;The one record everything else reads. Box 2 only looks at the prompt.&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;id · prompt · family · ground_truth · tags&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/models.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;class Task(BaseModel)&lt;/dd&gt;&lt;/dl&gt;">
    <rect x="330" y="105" width="230" height="120" rx="6" class="box data"/>
    <text x="445" y="130" text-anchor="middle" class="t">Task</text>
    <text x="445" y="150" text-anchor="middle" class="src">id · prompt · family</text>
    <text x="445" y="166" text-anchor="middle" class="src">ground_truth (toy only)</text>
    <text x="445" y="182" text-anchor="middle" class="src">tags</text>
    <text x="445" y="206" text-anchor="middle" class="s">one plain record, nothing else</text>
    </g>

    <path d="M230 115 H300 V150 H330" class="arrow" marker-end="url(#ah)"/>
    <text x="252" y="108" class="lbl">has an answer</text>
    <path d="M230 230 H300 V180 H330" class="arrow" marker-end="url(#ah)"/>
    <text x="244" y="248" class="lbl">no answer, no score</text>

    <path d="M560 165 H640" class="arrow" marker-end="url(#ah)"/>
    <g class="tip" tabindex="0" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;Hand-off. The drafting function receives the Task and reads its prompt.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;Task&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/draft.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;draft_team(task, llm, envelope, trace)&lt;/dd&gt;&lt;/dl&gt;">
    <rect x="640" y="125" width="200" height="80" rx="6" class="box plain"/>
    <text x="740" y="152" text-anchor="middle" class="t">→ Box 2</text>
    <text x="740" y="170" text-anchor="middle" class="s">Plan a new team</text>
    <text x="740" y="188" text-anchor="middle" class="s">reads only the prompt</text>
    </g>

    <g class="tip" tabindex="0" data-card="&lt;dl&gt;&lt;dt&gt;Description&lt;/dt&gt;&lt;dd&gt;Compares the answer with the known answer after trimming spaces and case.&lt;/dd&gt;&lt;dt&gt;Input&lt;/dt&gt;&lt;dd&gt;answer, ground_truth&lt;/dd&gt;&lt;dt&gt;Output&lt;/dt&gt;&lt;dd&gt;1.0 or 0.0, or None if there is no known answer&lt;/dd&gt;&lt;dt&gt;Who decides&lt;/dt&gt;&lt;dd&gt;Plain code&lt;/dd&gt;&lt;dt&gt;If it fails&lt;/dt&gt;&lt;dd&gt;No AI judge here on purpose&lt;/dd&gt;&lt;dt&gt;Files&lt;/dt&gt;&lt;dd&gt;task/evaluate.py&lt;/dd&gt;&lt;dt&gt;Code&lt;/dt&gt;&lt;dd class=&quot;c&quot;&gt;normalise(answer) == normalise(truth)&lt;/dd&gt;&lt;dt&gt;Later&lt;/dt&gt;&lt;dd&gt;Phase 2: AI judge as a signal only, with agreement logged&lt;/dd&gt;&lt;/dl&gt;">
    <rect x="880" y="105" width="270" height="120" rx="6" class="box code"/>
    <text x="1015" y="130" text-anchor="middle" class="t">Scoring (after Box 3)</text>
    <text x="1015" y="150" text-anchor="middle" class="s">exact match after trimming spaces</text>
    <text x="1015" y="164" text-anchor="middle" class="s">and case → 1.0 or 0.0</text>
    <text x="1015" y="180" text-anchor="middle" class="s">only when ground_truth exists</text>
    <text x="1015" y="206" text-anchor="middle" class="src">no AI judge in Phase 1</text>
    </g>

    <text x="30" y="300" class="s">Why toy tasks: the same 20 tasks run identically every time, so any change to Box 2 or Box 3 can be compared fairly. Real tasks come in Phase 2.</text>
  </svg>

  <!-- ================= BOX 2: PLAN ================= -->
  <svg id="v-plan" viewBox="0 0 1180 600" role="img" aria-label="Inside Plan a new team" hidden>
    <text x="30" y="36" class="hd">INSIDE BOX 2 · PLAN A NEW TEAM   (AutoAgents drafting: manager.py, environment.py)</text>

<div class="ov" id="ov" hidden><div class="ed" role="dialog" aria-modal="true" aria-labelledby="edh"><h2 id="edh">Request a change</h2><p class="box-id" id="edbox"></p><textarea id="edtxt" placeholder="What should change in this box? (wording, logic, a cap, a missing arrow…)"></textarea><div class="row"><span class="st" id="edst"></span><button type="button" class="btn" id="edcancel">Cancel</button><button type="button" class="btn primary" id="edsend">Send</button></div></div></div>

<script>
(function(){
  var views = {
    overview: {el: document.getElementById('v-overview'), title: 'Phase 1 overview', note: 'Three boxes, three modules. Everything purple is one or more AI calls; everything green is ordinary Python that Claude Code can unit-test without a model.'},
    task:     {el: document.getElementById('v-task'),     title: '1 · Task',              note: 'The Task box is deliberately dumb: a record with a prompt and, for toy tasks, the right answer. Nothing here calls an AI.'},
    plan:     {el: document.getElementById('v-plan'),     title: '2 · Plan a new team',   note: 'Nine AI calls at most. Everything after the loop is plain code, and that code is what protects the rest of the system from a sloppy draft.'},
    run:      {el: document.getElementById('v-run'),      title: '3 · Team runs the task', note: 'Two runners, one interface. Both write the same trace and the same RunResult, so later phases never care which topology ran.'}
  };
  var crumb = document.getElementById('crumb');
  var note = document.getElementById('note');
  function show(name){
    if(!views[name]) name = 'overview';
    Object.keys(views).forEach(function(k){ if(k === name) views[k].el.removeAttribute('hidden'); else views[k].el.setAttribute('hidden',''); });
    crumb.innerHTML = '';
    if(name !== 'overview'){
      var b = document.createElement('button'); b.type='button'; b.textContent = '◂ Back to overview';
      b.addEventListener('click', function(){ go('overview'); });
      crumb.appendChild(b);
      var here = document.createElement('span'); here.className='here'; here.textContent = 'Inside: ' + views[name].title;
      crumb.appendChild(here);
    } else {
      var h = document.createElement('span'); h.className='here'; h.textContent = 'Overview — click any box';
      crumb.appendChild(h);
    }
    note.textContent = views[name].note;
    var q = document.querySelector('.queue'); if(q) crumb.appendChild(q);
  }
  function go(name){
    try { history.replaceState(null, '', '#' + name); } catch(e){}
    show(name);
    window.scrollTo({top: 0});
  }
  Array.prototype.forEach.call(document.querySelectorAll('.hit'), function(g){
    g.addEventListener('click', function(){ go(g.getAttribute('data-view')); });
    g.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(g.getAttribute('data-view')); } });
  });
  window.addEventListener('hashchange', function(){ show(location.hash.replace('#','')); });
  show((location.hash || '#overview').replace('#',''));
})();

(function(){
  var tt = document.getElementById('tt'); var hideT = null; var current = null;
  function place(x, y){
    var pad = 14, w = tt.offsetWidth, h = tt.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var left = x + pad, top = y + pad;
    if(left + w > vw - 8) left = x - w - pad;
    if(left < 8) left = 8;
    if(top + h > vh - 8) top = y - h - pad;
    if(top < 8) top = 8;
    tt.style.left = left + 'px'; tt.style.top = top + 'px';
  }
  function showFor(el, x, y){
    clearTimeout(hideT); current = el;
    tt.innerHTML = el.getAttribute('data-card') || '';
    tt.setAttribute('aria-hidden', 'false');
    place(x, y); tt.classList.add('on');
  }
  function hide(){ hideT = setTimeout(function(){ tt.classList.remove('on'); tt.setAttribute('aria-hidden','true'); current = null; }, 60); }
  Array.prototype.forEach.call(document.querySelectorAll('.tip'), function(el){
    el.addEventListener('mouseenter', function(e){ showFor(el, e.clientX, e.clientY); });
    el.addEventListener('mousemove', function(e){ if(current === el) place(e.clientX, e.clientY); });
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', function(){ var r = el.getBoundingClientRect(); showFor(el, r.left + r.width/2, r.bottom); });
    el.addEventListener('blur', hide);
    el.addEventListener('touchstart', function(e){ var t = e.touches[0]; if(current === el){ hide(); } else { showFor(el, t.clientX, t.clientY); } }, {passive:true});
  });
  document.addEventListener('scroll', hide, {passive:true});
})();

(function(){
  // ---- per-box change requests -> Claude Code (local server) or a local queue you can copy ----
  var ENDPOINT = (location.protocol === 'http:' || location.protocol === 'https:') && /^(localhost|127\.0\.0\.1)/.test(location.host) ? '/edit' : null;
  var ov = document.getElementById('ov'), edbox = document.getElementById('edbox'), edtxt = document.getElementById('edtxt'),
      edst = document.getElementById('edst'), crumb = document.getElementById('crumb');
  var currentBox = null, queue = [];
  try { queue = JSON.parse(localStorage.getItem('amoeba_edits') || '[]'); } catch(e){ queue = []; }
  function saveQueue(){ try { localStorage.setItem('amoeba_edits', JSON.stringify(queue)); } catch(e){} renderQueue(); }
  function boxTitle(el){ var t = el.querySelector('text.t, text.t2'); return t ? t.textContent.trim() : (el.getAttribute('aria-label') || 'box'); }
  function viewOf(el){ var sv = el.closest('svg'); return sv ? sv.id.replace(/^v-/, '') : ''; }
  function openEditor(el){
    currentBox = {view: viewOf(el), box: boxTitle(el)};
    edbox.textContent = 'view: ' + currentBox.view + '   box: ' + currentBox.box;
    edtxt.value = ''; edst.textContent = ENDPOINT ? 'Will be sent to Claude Code (' + ENDPOINT + ').' : 'No local server: request is queued here; use Copy edits to hand them to Claude Code.';
    ov.removeAttribute('hidden'); edtxt.focus();
  }
  function closeEditor(){ ov.setAttribute('hidden',''); currentBox = null; }
  function send(){
    var text = edtxt.value.trim(); if(!text) { edtxt.focus(); return; }
    var rec = {view: currentBox.view, box: currentBox.box, request: text, ts: new Date().toISOString(), page: document.title};
    if(ENDPOINT){
      fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec)})
        .then(function(r){ if(!r.ok) throw new Error(r.status); edst.textContent = 'Sent to Claude Code.'; setTimeout(closeEditor, 500); })
        .catch(function(){ queue.push(rec); saveQueue(); edst.textContent = 'Server not reachable; queued locally.'; setTimeout(closeEditor, 900); });
    } else { queue.push(rec); saveQueue(); closeEditor(); }
  }
  document.getElementById('edcancel').addEventListener('click', closeEditor);
  document.getElementById('edsend').addEventListener('click', send);
  ov.addEventListener('click', function(e){ if(e.target === ov) closeEditor(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !ov.hasAttribute('hidden')) closeEditor(); });

  // inner boxes: click opens the editor. Top-level boxes: a pencil in the corner does.
  Array.prototype.forEach.call(document.querySelectorAll('.tip'), function(el){
    if(el.classList.contains('hit')){
      var r = el.querySelector('rect'); var x = parseFloat(r.getAttribute('x')) + parseFloat(r.getAttribute('width')) - 22, y = parseFloat(r.getAttribute('y')) + 20;
      var g = document.createElementNS('http://www.w3.org/2000/svg','text');
      g.setAttribute('x', x); g.setAttribute('y', y); g.setAttribute('class','glyph'); g.textContent = '✎';
      g.setAttribute('role','button'); g.setAttribute('aria-label','Request a change to ' + boxTitle(el));
      g.addEventListener('click', function(e){ e.stopPropagation(); openEditor(el); });
      g.addEventListener('mouseenter', function(e){ e.stopPropagation(); });
      el.appendChild(g);
    } else {
      el.addEventListener('click', function(){ openEditor(el); });
      el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); openEditor(el); } });
    }
  });

  // queue indicator + copy
  var qwrap = document.createElement('span'); qwrap.className = 'queue'; crumb.parentNode.insertBefore(qwrap, crumb.nextSibling);
  function renderQueue(){
    qwrap.innerHTML = '';
    if(!queue.length) return;
    var n = document.createElement('span'); n.textContent = queue.length + ' pending edit' + (queue.length > 1 ? 's' : ''); qwrap.appendChild(n);
    var c = document.createElement('button'); c.type = 'button'; c.className = 'btn'; c.textContent = 'Copy edits';
    c.addEventListener('click', function(){
      var txt = queue.map(function(q){ return JSON.stringify(q); }).join('\n');
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ c.textContent = 'Copied'; setTimeout(function(){ c.textContent = 'Copy edits'; }, 1200); }); }
      else { window.prompt('Copy these lines into edits.jsonl:', txt); }
    });
    var x = document.createElement('button'); x.type = 'button'; x.className = 'btn'; x.textContent = 'Clear';
    x.addEventListener('click', function(){ queue = []; saveQueue(); });
    qwrap.appendChild(c); qwrap.appendChild(x);
  }
  // put the queue on the crumb row
  crumb.style.flexWrap = 'wrap'; crumb.appendChild(qwrap); renderQueue();
  var origShow = window.__amoebaShow; // no-op guard
})();
</script>
