# D102 — the default niche: today's behaviour exactly (every tool, every model, no Environment section, no domain
# check, no extra limit). Copy this file to make a new niche.
description: "Any task; nothing beyond Amoeba's own rules."
tools:
  allowed: all              # tool names or patterns (calc, web_search, local:*, pool:*); "all" = no limit
  sandbox: {}               # D96 limits per command/run, overriding config/localtools.yaml: timeout_s, cpu, memory, run_timeout_s
models:
  allowed: all              # registry names (config/models.yaml); "all" = every registry model
  verifier_independence: null   # required | preferred | off; null = models.yaml's routing setting
domain:
  rules: []
  vocabulary: {}
done_when: []               # default done_when clauses added to the answer step
checks: []                  # amoeba/checks/<name>.py to run after each step
safety:
  max_usd_per_run: null
  max_tokens_per_run: null
  max_calls_per_run: null
  outside_actions: null     # false: refuse any tool with an outside-action word (send, buy, book, delete, ...)
