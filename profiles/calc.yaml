# D102 — figures computed from stated inputs (the calc task family's environment).
description: "Calculations from figures the task states: every final figure must be reproducible by calc."
tools:
  allowed: [calc, echo, "local:Bash", "local:Read", "local:Write", "local:Edit", "local:Glob", "local:Grep"]
  sandbox: {timeout_s: 300, cpu: "1", memory: "1Gi", run_timeout_s: 3600}
models:
  allowed: all
  verifier_independence: preferred
domain:
  rules:
    - "Use only the figures the task states; when a figure is missing, say so and state the assumption you use."
    - "Show each final figure next to the calculation that produced it."
  vocabulary:
    APR: "annual percentage rate (the yearly cost of a loan, in percent)"
done_when:
  - "Every final figure is computed with calc from the task's stated inputs and shown with its calculation."
checks: [calc]
safety:
  max_usd_per_run: 0.5
  max_tokens_per_run: null
  max_calls_per_run: null
  outside_actions: false
