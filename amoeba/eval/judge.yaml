# D171: the rubric grader — fixed, part of the frozen judge (amoeba/eval is hashed; so is the prompt). The model is a
# models.yaml registry entry, built by amoeba/eval/sim_score.py::grader_client and never shared with the team; its
# key comes from the environment only. Changing anything here changes the judge hash, and runs scored by different
# judges are never compared.
rubric:
  prompt: amoeba/config/prompts/rubric_grader.txt
  model: gemma-4-31b          # registry name (models.yaml); never the team's client
  temperature: 0.0
  calls: 3                    # the score is the median of these calls
  max_tokens: 8192            # Gemma reasons before its SCORE line: 1,024 and 4,096 cut it off (Part 2, Step 4)
