# Prices for the cost estimate printed after every run (D47): US dollars per 1 million tokens.
# Fill these in from your provider's price page; a model that is missing here, or has null prices, gets a
# token count only. Hidden reasoning ("thinking") tokens are priced as output tokens. Replies served from the
# response cache (D46) cost nothing and are left out of the estimate.
gemini-3.1-flash-lite: {input: null, output: null}
gemini-3.5-flash: {input: null, output: null}
gemma-4-31b-it: {input: null, output: null}
# D134: cache_read / cache_write price the prompt-cache parts of the input (Messages API, cache_prefix). Claude's
# pricing page (platform.claude.com/docs/en/about-claude/pricing, read 2026-10-16): Sonnet 5.5 $2 input, $10 output,
# cache reads $0.20 (0.1x input), 5-minute cache writes $2.50 (1.25x input), per 1M tokens
claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
