# D101 — task families for free-text tasks (Box 1): a task whose source gave no family ("freeform") is assigned one
# here. First the keyword rules (case-insensitive regular expressions, whole words); the family with the most
# matches wins, a tie is no match. Only when no rule decides does one routed LLM call (role family_classifier) pick
# from this list or "new"; code checks the answer against the list. A known family starts from its current recipe;
# "new" starts empty. Adding a family is an entry here (and, for a warm start, a recipe in the store).
families:
  calc:
    description: "Figures computed from stated inputs: arithmetic, totals, percentages, interest, loans, costs, unit conversions."
    keywords: ['compute', 'calculate', 'how much', 'how many', 'total', 'percent(age)?', 'interest', 'loan',
               'mortgage', 'payment', 'ratio', 'average', 'sum', 'cost', 'price', 'convert']
  research:
    description: "Facts found and compared from outside sources, with citations: who, what, where, latest figures."
    keywords: ['find', 'research', 'look up', 'sources?', 'cite', 'citations?', 'latest', 'compare', 'news',
               'who is', 'where is', 'official']
  document:
    description: "A file to produce: spreadsheet, slide deck, chart, report, PDF or Word document."
    keywords: ['spreadsheet', 'xlsx', 'excel', 'slides?', 'deck', 'pptx', 'chart', 'plot', 'pdf', 'docx',
               'word document', 'report file']
  code:
    description: "Code to write and run: scripts, programs, functions, data processing."
    keywords: ['script', 'python', 'program', 'function', 'code', 'algorithm', 'run it', 'unit tests?']
