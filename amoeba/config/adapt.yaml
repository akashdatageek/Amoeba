# D117: what plain code reads for in-task adaptation. The offline learning loop (experimenter, gate, monitor,
# retention) is gone; kept: the edit limits and validation (V1-V6), the cause -> allowed-edit table, the evidence log.
# Nothing here is read by a model. Quote on/off: YAML would read them as booleans.

recipe:                       # D81: what a team recipe may hold (validate_recipe)
  max_rules: 8                # V3
  max_transforms: 8           # V3
  max_text_chars: 300         # V3: a rule, a done_when clause or a role rule
  # V4: no rule or transform text may tell the team to skip checks, citations, the sandbox or the contract.
  # Matched case-insensitively as a substring; a hit is reviewed by hand.
  denylist: ["skip", "ignore", "without verif", "no citation", "no source", "disable", "bypass", "turn off",
             "no sandbox", "outside the sandbox", "no check", "don't check", "do not check", "unverified is fine"]
  # V1: tools a grant may name besides the envelope's registry tools (Box 3 hands these out at run time); a tool
  # whose name or description is an outside action (pool side_effect screen: write, edit, send…) is refused anyway
  grantable_extra: ["web_search", "fetch_url", "local:Bash", "local:Read"]
  # V2: the run options a recipe may set, and their ranges
  run_options:
    replan: {values: ["on", "off"]}
    self_refine: {values: ["off", "on-issues", "always"]}
    collab: {values: ["concat", "critique"]}
    max_turns: {min: 3, max: 8}
    check_retry_turns: {min: 1, max: 3}
    max_input_chars: {min: 3000, max: 20000}           # D114: characters of one input a step is shown (default 6000)
    max_summary_input_chars: {min: 15000, max: 60000}  # D114: characters of all outputs the summariser is shown (30000)
  allow_model_edits: false    # D98: prefer_model edits (built, off: one real model; --allow-model-edits turns it on)
  checker_role:               # add_verify_step: the role added when the team has no checker
    name: "Checker"
    tools: ["calc"]

diagnoser:                    # the cause -> allowed-edit table (kept from D86 by D117; edit it here)
  # tie order when two causes are found at once
  causes: [capability, checks, max_turns, unused_tool, claimed_file_missing, feedback, honesty]
  # "set_run_option:<name>" allows that one run option only
  allowed_edits:
    capability: [grant_tool, add_planner_rule, "set_run_option:replan", prefer_model]
    checks: [add_verify_step, tighten_done_when, add_role_rule, "set_run_option:check_retry_turns", prefer_model,
             "set_run_option:max_input_chars"]                                                   # D114
    max_turns: [add_planner_rule, "set_run_option:max_turns", prefer_model]
    unused_tool: [revoke_tool, add_role_rule]
    claimed_file_missing: [add_role_rule, add_verify_step]
    feedback: [add_planner_rule, tighten_done_when, add_role_rule, "set_run_option:max_input_chars",
               "set_run_option:max_summary_input_chars"]                                         # D114
    honesty: [add_verify_step, add_role_rule, tighten_done_when]
  max_evidence: 8             # evidence lines kept per diagnosis

evidence:                     # D95: the evidence log's off-container copy
  target: "github"            # github: the repository's orphan `evidence` branch; "none": no shipping
  branch: "evidence"          # a ruleset is meant to block force-push and deletion on it
  worktree: "../amoeba-evidence"   # the branch's worktree (relative to the repository), made if missing
  batch_seconds: 600          # at most one evidence commit per 10 minutes (forced at the end)
  retries: 3                  # push attempts per batch; what failed stays unshipped in loop_state.json
  gcs: {enabled: false}       # the bucket uploader is kept but disabled
