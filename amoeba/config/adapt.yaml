# D117: what plain code reads for in-task adaptation (amoeba/adapt/config.py). The offline learning loop is gone.
# Nothing here is read by a model. Quote on/off: YAML would read them as booleans.

limits:                       # checks the fix proposer's edit must pass (amoeba/adapt/proposer.py) and fix ranges
  max_text_chars: 300         # a rule, a goal, a done_when or a limitation sentence the proposer writes
  # No text the proposer writes may tell the team to skip checks, citations, the sandbox or the contract.
  # Matched case-insensitively as a substring.
  denylist: ["skip", "ignore", "without verif", "no citation", "no source", "disable", "bypass", "turn off",
             "no sandbox", "outside the sandbox", "no check", "don't check", "do not check", "unverified is fine"]
  # The values a code fix may set a step's run option to (amoeba/adapt/fixes.py, rung 1)
  run_options:
    max_turns: {min: 3, max: 8}
    check_retry_turns: {min: 1, max: 3}
    max_input_chars: {min: 3000, max: 20000}           # characters of one input a step is shown (default 6000)

diagnoser:                    # the stuck causes and the edits each allows (amoeba/adapt/stuck.py)
  # tie order when two causes are found at once: missing_input first (a mixed step is fixed for it, then re-checked)
  causes: [missing_input, capability, tool_error, checks, max_turns, claimed_file_missing]
  # Only edits something can apply: code fixes (add_dependency, rerun_upstream, "set_run_option:<name>" for that one
  # option, grant_tool from the pool) and the fix proposer's edits (add_role_rule, add_helper_role, grant_tool,
  # split_step, replan_remaining, work_around). Code fixes come first, the proposer only after them.
  allowed_edits:
    missing_input: [add_dependency, rerun_upstream, "set_run_option:max_input_chars", add_role_rule, split_step,
                    replan_remaining]
    capability: [grant_tool, add_helper_role, work_around, split_step, replan_remaining]
    tool_error: [add_role_rule, grant_tool, "set_run_option:max_turns", add_helper_role, replan_remaining]
    checks: ["set_run_option:check_retry_turns", "set_run_option:max_input_chars", add_role_rule, split_step,
             add_helper_role]
    max_turns: ["set_run_option:max_turns", split_step, add_role_rule]
    claimed_file_missing: [add_role_rule, grant_tool, split_step]
  max_evidence: 8             # evidence lines kept per diagnosis

adapt:                        # D117 Stage C: in-task code fixes (--adapt on); all limits are enforced by plain code
  max_fixes_per_step: 3       # fixes tried for one stuck step (a re-run of its upstream step counts as one)
  max_fixes_per_task: 8       # fixes tried in one task
  max_tokens_per_task: 200000 # tokens all fix attempts of one task may use (checked before each fix)
  max_usd_per_task: 1.0       # the same in dollars, when the model has a price (amoeba/config/prices.yaml)
  more_turns: 3               # rung 1: turns added by a "more turns" fix (capped by limits.run_options.max_turns)
  more_retry_turns: 1         # rung 1: retry turns added (capped by check_retry_turns)
  input_factor: 2             # rung 1: a shortened input's limit is multiplied by this (capped by max_input_chars)
  max_added_helpers: 2        # D117 D (user): helpers the fix proposer may add (add_helper_role) in one task
  stop_when_exhausted: true   # D117 D: the code fixes, then the fix proposer; none recovers the step → the task stops with a report

# D95, kept by D117: where the hash-chained event log is copied off the container. The log itself is each run's
# events.jsonl, written by the stuck watch, the fixes and the stops (amoeba/interp/plan_runner.py; checked by
# scripts/verify_evidence.py). make_shipper (amoeba/adapt/evidence.py) reads these settings; no run calls it yet, so
# run folders are committed by hand (docs/RUNNING_ON_A_VM.md, section 7).
evidence:
  target: "github"            # github: the repository's orphan `evidence` branch; "none": no shipping
  branch: "evidence"          # a ruleset is meant to block force-push and deletion on it
  worktree: "../amoeba-evidence"   # the branch's worktree (relative to the repository), made if missing
  batch_seconds: 600          # at most one evidence commit per 10 minutes (forced at the end)
  retries: 3                  # push attempts per batch; what failed stays queued for the next batch
  gcs: {enabled: false}       # the bucket uploader is kept but disabled
