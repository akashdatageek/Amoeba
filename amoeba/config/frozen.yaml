# D161: the frozen judge — every file that decides whether a run did well. Plain code hashes these at the start of
# each run (amoeba/eval/judge.py) and writes the hash to result.json and sim_score.json; a comparison of runs whose
# judge hashes differ is refused (D166). Nothing the lesson library or the outer loop may change is listed here, and
# the outer loop may change nothing that is listed here. A folder is hashed file by file; a missing path is recorded
# as missing (so adding it later changes the hash).
paths:
  - amoeba/checks              # domain checks run after each step (D102)
  - amoeba/task/quality.py     # Box 2's plain-code plan checks
  - amoeba/task/evaluate.py    # the answer score of tasks with a ground truth or a rubric
  - amoeba/eval                # the task scorers (D161) and this hash
  - amoeba/config/frozen.yaml  # this list itself
  - data/baselines             # baseline result files a scorer compares with (none yet)
  # D171: everything a real scorer reads. A path with * is matched against the repository (every match hashed).
  - amoeba/config/prompts/rubric_grader.txt   # the rubric grader's fixed prompt (its model: amoeba/eval/judge.yaml)
  - tasks/*_keys               # answer keys: one <task id>.json per task (numbers, strings, files checks, rubric)
  - tasks/*_hidden             # hidden tests: one <task id>/ pytest folder per task, never given to the team
