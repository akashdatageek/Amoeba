# D59: the local toolbox — Claude Code's own tools and skills, borrowed through `claude mcp serve` (amoeba/localtools/).
# Off by default (--local-tools off). With it on, the run must be inside a disposable sandbox (AMOEBA_SANDBOX=1).

command: [claude, mcp, serve]      # started over stdio, cwd = runs/<id>/workspace, closed at the end of the run
allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]   # everything else the server lists is refused (logged once each)

limits:
  timeout_s: 300                   # one call (D96a: 300 s; per niche profile, D102)
  max_output_chars: 8000           # of one call's result, passed to the helper
  max_calls_per_step: 20
  max_calls_per_run: 60
  max_skill_chars: 5000            # of a SKILL.md put on the role card (the whole folder is copied to the workspace)

# Where skills are listed from: the anthropics/skills clone that `python -m amoeba pool refresh` keeps under
# <pool cache>/repos/ (D59). D60: only that clone — the user's own Claude Code skill folders (~/.claude/skills) are
# not listed; add a {label, path} line here to list another folder.
skill_roots: []
repo_skills: repos                  # relative to the pool cache (data/pool/repos/<owner>_<name>/<skill>/SKILL.md)

# A request whose name (or standard name) contains every word of an alias is matched to that local item first.
aliases:
  "local:Bash": [code runner, python interpreter, code execution]
  "local:Write": [file writing, save file]
  "skill:xlsx": [excel, spreadsheet, xlsx]
  "skill:pptx": [presentation, powerpoint, pptx]
  "skill:docx": [word document, word doc, docx]
  "skill:pdf": [pdf reader, pdf]

# D96: where the local-tool server and every command it runs execute. openshell = a fresh NVIDIA OpenShell sandbox per
# run (gateway and image: amoeba/config/sandbox/; deny by default: no network, only the sandbox's own home and /tmp
# writable, skills and Claude Code's managed settings baked in read-only, no secrets, limits below), deleted at the end
# of the run; process = the D59 server on this host (needs AMOEBA_SANDBOX=1). The policy is fixed here and in the
# gateway; the agent cannot change it.
sandbox:
  isolation: openshell
  endpoint: "127.0.0.1:17680"
  image: "amoeba-sandbox:local"
  read_only: [/usr, /lib, /lib64, /bin, /sbin, /etc, /opt/skills, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
  readable_roots: [/opt/skills]    # paths outside the workspace that Read/Glob/Grep may name (read-only)
  cpu: "1"
  memory: "1Gi"
  run_timeout_s: 3600
