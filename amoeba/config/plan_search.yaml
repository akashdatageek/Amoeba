# D120: limits of the web search before planning (--plan-search on), read by amoeba/task/plan_search.py.
# Every limit is enforced by plain code; nothing here is read by a model. docs/design/D120_plan_search.md.

max_queries: 4              # queries run per plan (more are refused, "over the cap")
max_query_chars: 200        # one query
restate_share: 0.8          # a query whose words are this share or more of the task's words only restates it: refused
results_per_query: 3        # results kept per search
snippet_chars: 300          # one result's snippet, after screening
max_background_chars: 4000  # the whole block the Planner and both observers see
proposer_max_tokens: 4096   # the decision call's reply (Gemma's hidden reasoning counts against it, as in Box 1)
max_tokens: 12000           # all planning-search model tokens per run (the call and its one retry); over it, no search
