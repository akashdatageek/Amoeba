# Named model profiles (D54): how run_task and eval_draft call a real model (--llm openai --profile NAME).
# Model ids change: check the exact name against the provider's own list first
# (python -m scripts.list_models --profile NAME).
#
# A profile's keys:
#   base_url          the OpenAI-compatible endpoint
#   model             the model for every call without a per-role model below
#   api_key_env       the environment variable holding the key (AMOEBA_API_KEY, when set, is used first)
#   merge_system      true for models without a system role (Gemma): the system text goes into the user message
#   reasoning_effort  off | low | medium | high, sent only when set (off is sent as "none")
#   max_tokens        the reply limit of calls that set none of their own (the client default is 2048)
#   roles             optional, per role group: {model: ..., max_tokens: ...}. Groups: planner, observers (both
#                     Box 2 checkers), workers (Box 3 helpers), reviewers (boss_reviewers critics, the plan runner's
#                     verify steps and critique reviews), summariser (the role that writes the final answer),
#                     pool (Box 3's toolbox step: one short call per capability request picks a pool candidate,
#                     D56; without its own model it uses the workers' model)
#
# Precedence: --base-url / --model flags > AMOEBA_BASE_URL / AMOEBA_MODEL > the profile (per-role models still
# apply); --merge-system / --reasoning-effort flags > the profile; --planner-max-tokens / --observer-max-tokens >
# the profile's planner / observers max_tokens > AMOEBA_MAX_TOKENS_* > 8192.

default: gemma-api

profiles:
  gemma-api:                     # Gemma 4 through the Gemini API (Google AI Studio key)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemma-4-31b-it
    api_key_env: GEMINI_API_KEY
    merge_system: true             # no reasoning_effort: the API rejects it for Gemma (400 "Thinking level is not
                                   # supported for this model", D57)

  gemma-openrouter:              # Gemma 4 through OpenRouter, free variant (openrouter.ai key)
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-31b-it:free
    api_key_env: OPENROUTER_API_KEY
    merge_system: true

  gemini-flash-lite:             # the settings of the 2026-09-24 baseline runs
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY

  gemini-flash:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY

  arch-text:                     # tools/arch_text.py: re-checks the as-built page's box text (cheap, short replies)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY
    max_tokens: 700

# Example of per-role settings (not a shipped profile):
#   gemma-mixed:
#     base_url: https://generativelanguage.googleapis.com/v1beta/openai/
#     model: gemma-4-31b-it
#     merge_system: true
#     max_tokens: 4096
#     roles:
#       planner: {model: gemini-3.5-flash, max_tokens: 8192}
#       reviewers: {model: gemini-3.1-flash-lite}
#       pool: {model: gemini-3.1-flash-lite, max_tokens: 256}

# ---- D97: the model registry and the routing policy (the router: amoeba/llm/router.py) -------------------------------
# One entry per model. A new model is an entry here only — no code change. Keys: provider, base_url, model (the API's
# id), api_key_env, family (gemma, qwen, llama, gemini…), size_tier (small | medium | large), context_window,
# max_output, supports {json, tools, vision}, price (USD per 1M tokens: input, output), rate (requests and tokens per
# minute: rpm, tpm; rpd for the record), privacy (local | cloud), merge_system, reasoning_effort.
registry:
  gemma-4-31b:
    provider: google-ai-studio
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemma-4-31b-it
    api_key_env: GEMINI_API_KEY
    family: gemma
    size_tier: large
    context_window: 262144       # 256K tokens
    max_output: 32768
    supports: {json: true, tools: false, vision: true}   # tools: no native tool calling is used (text actions)
    # Gemini API price page (ai.google.dev/gemini-api/docs/pricing, read 2026-10-04): Gemma 4 is "Free of charge"
    # on the free tier; no paid tier is offered
    price: {input: 0.0, output: 0.0}
    # per-project free-tier limits (secondary sources, 2026-10-04; check AI Studio → API key → Rate limit):
    # 15 requests per minute, no token limit, 1,500 requests per day
    rate: {rpm: 15, tpm: null, rpd: 1500}
    privacy: cloud
    merge_system: true

routing:
  # the caller roles of Boxes 1–9 (amoeba/llm/router.py ROLES)
  roles: [interpreter, planner, agent_observer, plan_observer, worker, verifier, action_observer, summariser,
          architect, pool_picker, family_classifier]
  default_model: gemma-4-31b       # fixed mode, and the baselines
  # verifier independence: required (only another family may check, else no_model) | preferred (another family when
  # one is available, else the same one, logged as verifier_same_family) | off. Overridable per niche profile (D102)
  verifier_independence: preferred
  role_tiers: {}                   # role -> size tier for the cheapest-in-tier choice (default large)
  role_defaults: {}                # role -> registry name (the profile's default for that role)
